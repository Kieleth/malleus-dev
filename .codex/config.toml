[mcp_servers.cc002]
command = "python3"
args = ["scripts/contract_compiler_environment.py", "serve"]
cwd = "."
enabled = true
required = true
enabled_tools = ["cc002_acquire", "cc002_verify_offline"]
startup_timeout_sec = 10
tool_timeout_sec = 3600

[mcp_servers.cc002.tools.cc002_acquire]
approval_mode = "prompt"
