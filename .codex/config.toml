# Project activation and policy only. The absolute machine transport belongs in
# ~/.codex/config.toml. See .codex/README.md before changing this server or
# adding an MCP-dependent skill.
[mcp_servers.cc002]
enabled = true
required = true
enabled_tools = ["cc002_acquire", "cc002_verify_offline"]
startup_timeout_sec = 10
tool_timeout_sec = 3600

[mcp_servers.cc002.tools.cc002_acquire]
approval_mode = "prompt"
