[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "malleus-dev"
version = "0.7.0"
description = "Root ontology in LinkML for ontology-typed knowledge graphs with write-time validation and content-addressable convergence"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Luis Guzman Lorenzo" }]
requires-python = ">=3.10"
keywords = ["ontology", "knowledge-graph", "linkml", "typed-graph", "crdt", "schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "linkml>=1.10",
    "linkml-runtime>=1.10",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
research = ["anthropic>=0.49", "openai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.0", "hatchling==1.31.0", "twine==6.2.0"]

[project.scripts]
malleus-inquisitor = "malleus.inquisition.cli:main"

[project.urls]
Homepage = "https://github.com/kieleth/malleus-dev"
Documentation = "https://github.com/kieleth/malleus-dev/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/kieleth/malleus-dev"
Issues = "https://github.com/kieleth/malleus-dev/issues"

[tool.hatch.build]
# Only the files explicitly listed below are packaged. Anything else present
# in the working tree (local scratch files, experimental modules, notes) is
# ignored by the build.
include = [
    "src/malleus/__init__.py",
    "src/malleus/ontology.py",
    "src/malleus/kg.py",
    "src/malleus/protocol.py",
    "src/malleus/assent.py",
    "src/malleus/accepted.py",
    "src/malleus/ledger.py",
    "src/malleus/staging.py",
    "src/malleus/control.py",
    "src/malleus/logic.py",
    "src/malleus/orchestration.py",
    "src/malleus/execution.py",
    "src/malleus/status.py",
    "src/malleus/source.py",
    "src/malleus/prolog_verifier.py",
    "src/malleus/inquisition/__init__.py",
    "src/malleus/inquisition/cli.py",
    "src/malleus/inquisition/rubric.yaml",
    ".claude/skills/malleus-inquisitor/SKILL.md",
    ".claude/skills/malleus-acolyte/SKILL.md",
    "tests/test_inquisition.py",
    "ontology/**/*.yaml",
    "prolog/**/*.yaml",
    "prolog/**/*.pl",
    "tests/test_ontology.py",
    "tests/test_kg.py",
    "tests/test_assent_ontology.py",
    "tests/test_protocol.py",
    "tests/test_accepted.py",
    "tests/test_staging.py",
    "tests/test_control.py",
    "tests/test_logic.py",
    "tests/test_status.py",
    "tests/test_prolog_verifier.py",
    "docs/**/*.md",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/malleus"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.shared-data]
"ontology" = "share/malleus/ontology"
"prolog" = "share/malleus/prolog"
"docs" = "share/malleus/docs"
".claude/skills" = "share/malleus/skills"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "tests/test_ontology.py",
    "tests/test_kg.py",
    "tests/test_prolog_verifier.py",
    "tests/test_assent_ontology.py",
    "tests/test_protocol.py",
    "tests/test_accepted.py",
    "tests/test_staging.py",
    "tests/test_control.py",
    "tests/test_logic.py",
    "tests/test_status.py",
    "tests/test_inquisition.py",
]
python_files = ["test_*.py"]
