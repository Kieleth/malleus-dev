[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "malleus-dev"
version = "0.13.3"
description = "Root ontology in LinkML for ontology-typed knowledge graphs with write-time validation and content-addressable convergence"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Luis Guzman Lorenzo" }]
requires-python = ">=3.10"
keywords = ["ontology", "knowledge-graph", "linkml", "typed-graph", "crdt", "schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "linkml==1.11.1",
    "linkml-runtime==1.11.1",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "tzdata==2026.3",
]

[project.optional-dependencies]
research = ["anthropic>=0.49", "openai>=1.0"]
recon = ["pyvis>=0.3.2"]
ocr = []
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "Pillow==12.3.0",
    "pypdf==6.16.2",
    "reportlab==4.4.9",
    "jsonschema>=4.23,<5",
    "build==1.2.2.post1",
    "hatchling==1.31.0",
    "ruff==0.11.9",
    "docutils==0.21.2",
    "markdown-it-py==3.0.0",
    "rdflib==7.6.0",
    "sphinx==8.1.3",
    "myst-parser==4.0.1",
    "tomli>=2.0; python_version < '3.11'",
    "twine==6.2.0",
]

[project.scripts]
malleus-inquisitor = "malleus.inquisition.cli:main"
malleus-compiler = "malleus.compiler_cli:main"
malleus-ocr = "malleus.ocr.cli:main"
malleus-recon = "malleus.recon.cli:main"

[project.urls]
Homepage = "https://github.com/kieleth/malleus-dev"
Documentation = "https://github.com/kieleth/malleus-dev/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/kieleth/malleus-dev"
Issues = "https://github.com/kieleth/malleus-dev/issues"

[tool.hatch.build]
