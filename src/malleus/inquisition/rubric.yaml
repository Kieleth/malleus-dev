# The Ordo Malleus rubric.
#
# One file, two tiers. `mechanical` rites are implemented by the
# malleus-inquisitor CLI and judged without taste. `judgment` rites need a
# reader (human or LLM); the malleus-inquisitor skill applies them and writes
# its findings to MALLEUS_INQUISITION.md in the inspected repo.
#
# Every rite was paid for by a real adoption. The `lesson` field records the
# generic failure, never the project. Learnings flow back upstream: open an
# issue or PR against malleus-dev with the generic lesson only.
#
# This file is data on purpose, and the tuning contract is exact:
#
#   severity:      sets the severity of the rite's PRIMARY finding. Secondary
#                  findings (commendations, and graded sub-findings below the
#                  primary condition) carry their own severity at the call
#                  site and are not tuned from here.
#   enabled: false disables a rite. Deleting the entry does NOT disable it;
#                  it breaks the instrument and the rites refuse to run, so a
#                  mistyped id can never quietly switch a gate off.
#   status:        required when severity is NOTE. `open_question` means the
#                  underlying property is not yet established, `low_stakes`
#                  means it is established and minor and additionally requires
#                  `status_reason:`, because nobody can check "low stakes" and
#                  a sanctioned field is where a severity softened to keep a
#                  build green would otherwise hide.
#
# Tune a COPY and pass it with `malleus-inquisitor --rubric PATH`. Editing the
# packaged file works and is reverted without warning by the next upgrade,
# taking every severity you raised with it.

version: 12

config:
  # Tokens the inert_formula rite matches as substrings of slot names.
  # Data on purpose: widen it when your domain spells "formula" differently.
  formula_slot_tokens:
    - formula
    - formal_expression
    - expression
    - equation
    - calculation
    - computation

mechanical:
  - id: construction
    question: Does the schema construct, with every import resolved?
    severity: HERESY
    lesson: >-
      A schema that cannot load is not a source of truth. Observed: a broken
      symlink to a renamed directory left a project unable to regenerate for
      months, and nothing noticed because nothing tried. Observed, worse: an
      early import resolver that silently skipped unresolvable imports let a
      flagship adopter run in production with the root never loaded; its
      zero-rejection record reflected an open gate, and a quarter of its
      largest graph failed once the root resolved. An import that resolves
      to nothing must be its own loud refusal, distinct from a parse
      failure, and a rejection rate of zero is not evidence of a gate.
  - id: root
    question: Are the primitives present at all?
    severity: HERESY
    lesson: >-
      A schema missing the primitives never imported the root, and nothing
      downstream can be judged: every later rite would be asking questions
      about a vocabulary that is not there. This rite and root_has_speakers
      were one entry until an inspection found the declared severity (NOTE)
      disagreeing with the severity the code emitted (HERESY) for the primary
      condition. Two questions at two volumes need two rites, or the rite
      table itself becomes the thing that says one and does the other.
  - id: root_has_speakers
    question: Does each declared primitive have at least one concrete subtype?
    severity: NOTE
    status: low_stakes
    status_reason: >-
      An unextended primitive costs nothing today and is worth knowing about;
      the schema still loads, still validates, and still converges.
    lesson: >-
      Vocabulary with no reader or writer is where drift begins. Observed: a
      narrative ontology fully declared and consumed by nothing; Signal, the
      most distinctive primitive, adopted least across an entire fleet.
  - id: root_currency
    question: Is the imported root a superset-or-identical match of the installed malleus?
    severity: HERESY
    lesson: >-
      Vendored root copies drift silently. Observed twice in one project:
      stale 0.3.0 copies while upstream moved to 0.4.0 with changed ranges
      and bounds. Regenerating against the wrong root produces different
      storage schemas with no error anywhere.
  - id: root_currency_answerable
    question: Could the currency question be answered at all?
    severity: HERESY
    lesson: >-
      A check that cannot run must block. Observed at home: when the reference
      root could not be read (corrupt file, absent path), the currency rite
      recorded a hardcoded suspicion and the schema took the purity seal at
      exit 0, so the single most repeated adoption failure in the field went
      unjudged and the tool said everything was fine. "I could not determine
      whether your root is current" is an unknown condition, and an unknown
      condition refuses.
  - id: constrained_tongues
    question: Is every event_type / relation_type / signal_type narrowed to an enum or pinned?
    severity: HERESY
    lesson: >-
      A loose string type-slot admits anything. The root leaves these open on
      purpose; the domain schema MUST close them (Ontology Protocol rule 3).
  - id: bound_endpoints
    question: Does every concrete Relation pin its predicate and narrow both endpoints?
    severity: SUSPICION
    lesson: >-
      Observed: a generator assigned every relation type (Entity, Entity), so
      endpoint validation degenerated to "does this name exist". The relation
      contract must be generated from Relation subclasses, not harvested from
      an enum.
  - id: derived_signals
    question: Does every Signal require a bearer and carry algorithm and computed_at?
    severity: SUSPICION
    lesson: >-
      A Signal is computed, never asserted. Observed: signals written with an
      empty bearer to satisfy the type checker, and a platform that redefined
      Signal as an Event, inverting the BFO commitment. If it is not
      recomputable from its inputs, it is not a Signal.
  - id: inert_formula
    question: Is any formula-shaped slot backed by an executor, or explicitly marked inert?
    severity: SUSPICION
    lesson: >-
      Five systems in one fleet wrote formulas down as data and none executed
      them; each kept a hand-written twin in code that drifted. A formula the
      engine cannot evaluate is documentation wearing the graph's clothes.
      Judgment-tier corollary the token scan cannot see: algorithm NAMES
      declared as enum values with no implementing code are the same defect
      (the slot named `algorithm` itself is canonical Signal provenance and
      must not be flagged; the unimplemented value behind it must be).

judgment:
  - id: protocol_role_is_explicit
    question: >-
      Does every deliverable and capability claim name its lowest affected
      profile and classify its role as PROTOCOL_INVARIANT, OPTIONAL_PROFILE,
      REFERENCE_IMPLEMENTATION, CONFORMANCE_FIXTURE, or ADOPTER_CHOICE,
      without treating a shipped default or a fixture as protocol authority?
    severity: HERESY
    lesson: >-
      A reference implementation can faithfully realize a protocol invariant,
      and a conformance fixture can exercise it. Neither is itself the
      invariant. When those roles are left implicit, the most complete default
      quietly becomes mandatory and the current example's vocabulary becomes
      universal doctrine. Classification is about the authority of the claim,
      not its file location: protocol prose can describe an adopter choice,
      while runtime code can enforce a genuine invariant.
  - id: optional_profile_stays_optional
    question: >-
      Does an OPTIONAL_PROFILE stay optional outside its declared lowest
      affected profile, while dependencies genuinely required within that
      profile remain allowed?
    severity: HERESY
    lesson: >-
      Requiring LinkML or an EffectiveContract within the compiler-enabled
      profile is legitimate. Requiring either from adopters who do not claim
      that profile turns one toolchain into the protocol. This rite does not
      condemn profile-internal dependencies. It condemns an optional profile,
      default adapter, fixture, or derived artifact leaking into core APIs,
      unqualified success claims, or unrelated conformance gates.
  - id: protocol_authority_is_data
    question: >-
      Could a second conforming interpreter load the same identified artifacts
      and produce the same accepted state or typed refusal without copying
      profile-specific event, record, field, transition, effect, or refusal
      branches from the current implementation?
    severity: HERESY
    lesson: >-
      Portable protocol meaning belongs in explicit contract facts,
      protocol-machine programs, and exact policy or projection references.
      An interpreter supplies generic evaluation, transactions, hashing, and
      declared typed capabilities. A hidden host-language branch makes that
      implementation protocol authority. An arbitrary-code escape hatch merely
      hides the branch and is not a conforming extension boundary.
  - id: single_ledger_knowledge_change
    question: >-
      Does every governed domain-state change use one immutable
      KnowledgeChangeSet identity across proposal, checks, review, decision,
      application, and replay through one authoritative ordered ledger, with
      no independent accepted-state write path?
    severity: HERESY
    lesson: >-
      The accepted temporal graph is a replay-derived view, not another
      authority. Initial knowledge must be retained as a genesis change set
      over an empty graph. Operation dependencies stay local to one change set.
      A plan or persisted structural candidate may be useful, but remains
      non-governed and non-accepted until ledger admission. Hidden graph-base
      state or a direct materializer makes reconstruction incomplete and gives
      the system two sources of truth.
  - id: gate_integrity
    question: >-
      Is the registry constructor-required and enforced on EVERY write path:
      typed API, string API, property updates, deserialization, load, merge?
    severity: HERESY
    lesson: >-
      The advisory registry is the most common defect in the field: the
      constitutive docstring shipped with a registry=None default, dead
      validation methods, an unvalidated update path, or a load path that
      bypasses everything. The gate is only real if there is no side door.
  - id: silent_drop
    question: Are unknown or renamed properties rejected loudly, never filtered?
    severity: HERESY
    lesson: >-
      A write layer that silently filters unknown columns cost one project its
      entire learning channel for months (a renamed column mapped nowhere and
      every record landed empty). Silent drop is how a typed graph degrades
      into an untyped one without anyone noticing.
  - id: reader_census
    question: Does every declared type have at least one writer AND one reader?
    severity: SUSPICION
    lesson: >-
      A KG whose writes are never read is an expensive log. One research loop
      audited itself and found eight of thirteen deviations were "learning
      infrastructure written but inert". Write-only types need an explicit
      write-only-with-reason annotation or a reader.
  - id: citation_integrity
    question: Do axiom references, rule ids, and cited node ids resolve mechanically?
    severity: HERESY
    lesson: >-
      Cross-file string references (rule cites axiom id, alert ships it to the
      UI) die silently on rename. The strongest observed pattern makes claims
      committable only when every cited id resolves, and records the failure
      to ground as a typed node.
  - id: provenance_typed
    question: Is provenance carried in typed fields, never substring markers in free text?
    severity: SUSPICION
    lesson: >-
      Observed: source strings like "Set via AI [confidence=low]" recovered by
      substring search, while proper enums existed one layer away. Provenance
      that lives in string concatenation cannot be queried or enforced.
  - id: fail_closed
    question: Do critical rules fail closed, and do unknown conditions refuse rather than pass?
    severity: HERESY
    lesson: >-
      Observed: a rule evaluator that catches all exceptions and returns no
      alerts, so a broken critical safety rule silently stops firing for a
      product with real users. A critical check that cannot run must block.
  - id: flag_never_delete
    question: Can any rule severity produce a deletion, directly or through a correction loop?
    severity: HERESY
    lesson: >-
      Observed: an error-severity rule fed a correction loop that turned every
      violation into a silent deletion of valid records on every run. A rule
      sees one item and one predicate; the truth needs the record around it.
      Violations are hints to a reviser, never drop lists.
  - id: single_source
    question: Does every threshold, enum, and formula have exactly one authoritative home?
    severity: SUSPICION
    lesson: >-
      Observed: one runway threshold in axiom prose, rule condition, and code
      literal, disagreeing; growth-stage bands triplicated across schema,
      template, and prompt. If two copies exist, one is already wrong.
  - id: derived_not_stored
    question: Is any value the schema calls computed actually stored as a hand-typed input?
    severity: SUSPICION
    lesson: >-
      Observed: a connection count hand-maintained in YAML while the schema
      declared it a computed Signal. The graph then certifies a fiction.
  - id: dependency_pin
    question: Is the root dependency resolved from the installed package, version-gated, and drift-tested?
    severity: HERESY
    lesson: >-
      Symlinks to sibling checkouts, hash pins with no upgrade path, and
      sed-rewritten Dockerfiles all failed in the field. The working pattern:
      probe capability, never presence (an installed package may be stale
      or a name-squatter; import the symbol you need, not the module name);
      resolve from the installed package, gate on a version floor, assert
      check_compatibility_strict in a test (the consumer-side variant: the
      producer-side check_compatibility is blind to a dropped `required`
      constraint, and naming it here is the confusion that
      the_rite_survives_its_subject warns about), regenerate in CI and fail
      on dirty diff.
  - id: trusted_explicit
    question: Is every validation bypass an explicit property of the operation, never inferred from context?
    severity: SUSPICION
    lesson: >-
      Observed: checkpoint replay that skipped validation by context laundered
      unvalidated data through compaction; two consecutive releases shipped
      bugs on that fork, found in production downstream.
  - id: rejection_as_data
    question: Do rejections carry machine-readable diagnosis (reason, offending type, schema hash)?
    severity: SUSPICION
    lesson: >-
      Observed: a quarantine that returns bare hashes with the rich error
      discarded, forcing operators to re-derive why by hand. Malleus carries
      rejection_reason; every layer built on it must keep that property.
  - id: fingerprint_from_validator
    question: >-
      Is identity (hash and fingerprint) computed from the RESOLVED
      constraint table the validator consults, never from the declaration
      syntax, covering every enforced constraint including slot membership
      and any resolution-order dependence?
    severity: HERESY
    lesson: >-
      Verified in the field, then verified at home. Field: a hand-maintained
      fingerprint emitter covered only enum constraints, so two peers with
      incompatible numeric bounds read "identical" while one silently
      quarantined the other's data. Home, first self-inquisition: mixin
      declaration order changed the effective validator (last-wins merge)
      while the identity hash sorted the mixin list, so two peers whose
      validators rejected each other's data read "identical" on every
      available check; and a slot attached by a documentation-only usage
      entry grew the accepted-property set while emitting zero facts, so the
      peer that would reject every record certified "superset". Where
      declaration and resolution coincide the fingerprint is correct; where
      they diverge it goes blind. Walk the resolved slot table. A
      canonicalization that discards an ordering the resolver honors is not
      canonicalization, it is data loss in the one function that must not
      lose data. Better still: make resolution order unrepresentable by
      rejecting order-dependent conflicts at construction.

  - id: release_target_resolves
    question: >-
      Do packaging declarations (console scripts, include lists, extras)
      resolve in a clean install, verified by CI invoking them, and is the
      release path gated on the test suite?
    severity: HERESY
    lesson: >-
      Packaging metadata is a cross-file string reference and dies silently
      on a partial commit. Observed: a manifest declaring an entry point and
      include paths for files that were not yet committed; the metadata
      linter passed because it validates the manifest, never the target.
      Install the built artifact into a clean environment and invoke every
      declared entry point in CI. Separately: a release workflow that does
      not depend on the test workflow is not gated, whatever the branch
      protection says.

  - id: divergence_signal_is_quiet
    question: >-
      Do semantically equal declarations, numeric spellings AND inert
      variants (explicit-false flags, no-op overrides, repeated
      declarations), canonicalize to the same identity?
    severity: SUSPICION
    lesson: >-
      Observed: integer and float spellings of the same numeric bound
      produced different facts, so schemas enforcing identical constraints
      reported divergent. Second pass: an explicitly-false boolean where
      absence means the same thing, a no-op override entry, and a repeated
      mixin declaration each produced a different identity for the same
      validator. All err safe, but a divergence check that cries wolf gets
      muted, and a muted check is why the real divergence ships. Noise in a
      safety signal is a defect in the safety signal.

  - id: encodable_at_the_gate
    question: >-
      Does every value the validator accepts survive the serialization the
      identity layer performs?
    severity: HERESY
    lesson: >-
      A validator that checks a value's in-memory type while identity is
      computed from its wire encoding has two different acceptance sets, and
      the gap between them is a write that commits and then cannot be
      hashed. Observed: a string that passed the type check and json.dumps
      but could not be UTF-8 encoded; the write committed with no rejection,
      and afterwards the state digest, the staging path, and both ledger
      append and ledger read raised an untyped encoding error, including the
      read path, whose whole purpose is to turn corruption into diagnosis.
      Reject at the width of the narrowest layer downstream, and make the
      serializer convert every encoding failure into the typed rejection its
      callers already catch.

  - id: the_rite_survives_its_subject
    question: >-
      Does the mechanical inspector convert every way its subject can be
      malformed into a recorded finding, rather than into an exception, and
      does it refuse to judge a document that is not its format?
    severity: HERESY
    lesson: >-
      An inspector that catches only its own error type crashes on the most
      common upstream failure, a syntax error in the very file it exists to
      judge, and then reports nothing at all. To an operator a traceback
      reads as a broken tool, not a broken subject, so the finding is not
      merely missed, it is misattributed. Catch the parser's exception
      hierarchy too, and prove it with a deliberately corrupt input. The
      currency corollary: a drift rite must use the identity function that
      includes every constraint the CONSUMER's validator enforces; a
      currency check built on the producer-side variant certifies a root
      whose validator it should condemn, and the guidance shipped to
      adopters tends to carry the same confusion.
  - id: remediation_actually_remediates
    question: >-
      Does every documented remediation, when executed exactly as the
      operator would, produce the promised effect, proven by a test that
      performs the operator's steps?
    severity: HERESY
    lesson: >-
      Observed: documentation promised that quarantined data is re-evaluated
      when the ontology changes; the operator performed exactly that change
      through the local API and the data stayed invisible, surviving even a
      reopen from disk. A remediation that exists only in prose is worse
      than no remediation: it consumes the operator's one diagnostic guess.
      Every "to recover, do X" sentence needs a test that does X and
      asserts the recovery.

  - id: graph_load_bearing
    question: For any LLM-facing demo or eval, can the model answer from parametric memory alone?
    severity: SUSPICION
    lesson: >-
      Measured: a no-tools, no-memory baseline beat the full architecture
      because the task was recall. Demos need entities the model cannot know
      or state it cannot reconstruct, or they prove nothing. State the prompt
      style too: tool-call propensity varied 25x across models on identical
      prompts. Size is not a result either: a larger graph with no
      discriminating observation proves nothing a smaller one did not.

  # Principles rites. These five defend the properties in docs/PRINCIPLES.md:
  # the typed intermediate, the byte-exact citation, the named arbiter, the
  # separation of claims, and the interface a reusable subgraph must declare.

  - id: encoding_is_load_bearing
    question: >-
      Is there a typed intermediate between source and conclusion, and is that
      intermediate the thing that gets checked, rather than the prose before it
      or the answer after it?
    severity: HERESY
    lesson: >-
      You cannot validate a sentence. Every guarantee in this stack (ranges,
      endpoint contracts, executable rules, staging, assent, replay) operates
      on tuples, so a pipeline that runs text to answer with no typed middle
      has nowhere to put a gate: it can be careful, it cannot be checked.
      Observed: systems that validate the prompt and lint the final string
      while the only structured artifact is assembled after the last check,
      and systems whose typed layer exists but is written from the answer
      rather than read to produce it. The model-facing corollary: the gate
      belongs on the commit, never on the reasoning. Let it think in
      sentences, make it commit in tuples, hand back the violated constraint.

  - id: quotation_is_byte_exact
    question: >-
      Does every citation pin bytes, with the quoted span verified as a
      verbatim substring of the named source at write time, and does a change
      in the source invalidate the citation rather than merely refreshing a
      cache?
    severity: HERESY
    lesson: >-
      A citation graph is what lets a system claim it preserved the original
      intent, and it is the property most often faked by accident, because a
      hand-copied quote is indistinguishable from a verified one until someone
      measures. Measured in the field: of 67 evidence quotes, 15 did not
      appear in the source they cited, and one file's five quotes were all
      invented, including one asserting a term that occurs zero times in the
      cited text. The content hash sitting beside them was consumed only as a
      cache key, so seven stale quotes shipped from changed sources and the
      newest file carried no hash at all. Companion to citation_integrity:
      that rite checks the cited id resolves, this one checks the cited bytes
      do.

  - id: arbiter_is_accountable
    question: >-
      When acceptance is decided automatically, is the decision a typed record
      carrying its inputs, verdict, reason, and the identity and version of the
      judge, and does everything it declines land in a queue whose age is
      measured and past a threshold blocks?
    severity: HERESY
    lesson: >-
      Nothing here self-corrects. Biology tolerates enormous error rates
      because proofreading and selection run over deep time; a designed system
      has neither, so an automatic judge whose reasons are not recorded and a
      review queue nobody drains are both silent acceptance wearing a process.
      Observed: approval gates that were filesystem conventions, one with a
      suggestion file open four months and no age recorded anywhere; and
      machine verdicts stored as a bare boolean, so when the judge changed
      version no decision could be attributed to either. Name the corrector,
      record what it saw, measure the queue.

  - id: evidence_does_not_transfer
    question: >-
      Is any result reported as evidence for a claim it did not test: a
      representation result quoted as an execution result, a passing rule
      quoted as governance, or a composed module's validity inferred from the
      validity of its parts?
    severity: HERESY
    lesson: >-
      Representing a domain is not executing it, executing rules is not
      governing what gets accepted, and governing acceptance does not help
      anybody do anything. Each tier is a separate claim needing its own
      observation. Composition needs its own check too, because two sound
      modules can compose into an unsound one at the interface. The failure is
      always quiet: the first honestly measured link in a chain gets cited for
      every later one, and no reader can tell which link was measured.

  - id: module_declares_its_interface
    question: >-
      Does a subgraph meant to be reused declare typed inputs, typed outputs,
      and the constraints it enforces, so that composing it with another is a
      checkable operation rather than a copy and a hope?
    severity: NOTE
    status: open_question
    lesson: >-
      A subgraph without a declared interface is a region, not a module, and
      reuse degenerates into duplication that drifts. Whether well-designed
      primitives compose into richer domain models without losing
      checkability is an open question in this project, not a settled
      property, so this rite asks and does not condemn. Raise its severity in
      a copy of this file passed with `malleus-inquisitor --rubric PATH` when
      your project depends on composition.

  # Rites sent up the loop by an adopting project and accepted on the roadmap
  # (A1 to A5). Each was paid for in a repository that is not this one. The
  # generic lesson travels; the project does not.

  - id: instance_reader_coverage
    question: >-
      Is every populated region of the graph reached at runtime, or does a
      type-level reader census pass while whole subgraphs stay unread?
    severity: SUSPICION
    lesson: >-
      A reader census is satisfied by one reader touching one instance. A type
      can be read on Monday, extended with a hundred new instances on Tuesday,
      and the census still reports it healthy while none of the hundred is ever
      reached. Observed: a table of two dozen rows, every row cited to its
      source, every count asserted by an invariant, referenced by exactly one
      thing in the repository, which was the generator that wrote it. A
      neighbouring path reached the same content through a side door, so the
      type had a reader and the census was clean. Every generated result was a
      step short of the source for as long as the feature had existed, and an
      audit of OUTPUT found it because no gate could. The escalation condition
      is whether the engine EXECUTES the graph: where unread data means only
      wasted storage this is a suspicion, and where the graph is the program it
      is a heresy, because unread rules are silently absent behaviour rather
      than dead weight. Two discharges, catching different amounts: a static
      walk from entry points is cheap and blind to side doors, which was
      seventeen of twenty-three in the observed case; a runtime journal of
      touched ids plus a sweep is complete and costs a journal.

  - id: claim_kinds_distinguished
    question: >-
      Do the project's gates distinguish fidelity, coherence and consequence,
      or does a wall of green on the first two read as assurance about the
      third?
    severity: NOTE
    status: low_stakes
    status_reason: >-
      The distinction is established and the cost of missing it is a
      misread rather than a broken gate; the underlying checks still run.
    lesson: >-
      Three independent claims get conflated because they are all "the checks
      pass". FIDELITY is that the data matches its source: citations resolve,
      values appear in the text they quote. COHERENCE is that the assembled
      graph is well formed: no dangling references, ranges tile, ordered parts
      are contiguous. CONSEQUENCE is that the system acts on it. A project can
      hold the first two to an unusually high standard and have no vocabulary
      at all for the third, and the strength of the first two is precisely what
      makes the absence invisible. Observed: a verifier proving every citation
      resolved in the vendored source and every number appeared in the sentence
      it quoted, which had caught real defects including four in a published
      book, and which said nothing whatever about whether the engine read the
      data. Name the three in the docs and state which gate serves which.

  - id: unread_declared
    question: >-
      Can a record say "nothing reaches me yet, and here is why", or is silence
      the only way to express it?
    severity: NOTE
    status: low_stakes
    status_reason: >-
      An annotation gap costs signal quality rather than correctness, and a
      project can carry it indefinitely without a wrong answer.
    lesson: >-
      Partial absorption already has a home in most adopting schemas: a slot
      recording the part of a rule the graph does not yet express, so a partial
      rule cannot look whole. That slot describes a record whose EXPRESSION is
      incomplete. It has no answer for a record that is fully expressed and
      never invoked, which is the failure a coverage gate surfaces. Without a
      declared-exception slot the gate has only two settings, pass and
      nuisance, and the second one gets it switched off. With one, the gap is a
      countable number of argued exceptions instead of a silence. Pairs with
      instance_reader_coverage; neither is much use without the other.

  - id: guidance_newer_than_runtime
    question: >-
      When the documented resolution order falls through from the installed
      package to a local checkout, does anything notice that the reader is now
      following guidance newer than the code they run?
    severity: SUSPICION
    lesson: >-
      A resolution order that tries the installed package first and a developer
      checkout second degrades in the dangerous direction. The fallback is not
      equivalent, it is NEWER: the adopter reads the newest rubric, rites and
      protocol docs while their runtime executes a package several minor
      versions old. Observed: a bootstrap command from a current skill raising
      ImportError against an installed 0.1.0 while a 0.6.0 checkout sat beside
      it, the symbol having been added in between, so five minor versions of
      drift surfaced as a confusing import error rather than a version
      complaint. This is root_currency inverted, and worse, because that rite
      compares two copies of the root while this compares documentation against
      code and nothing diffs them. Make the version a first-class output of the
      bootstrap step: print the installed version and the resolved root, and
      refuse when they disagree, instead of letting an ImportError stand in for
      "your package is old".

  - id: unknown_range_blast_radius
    question: >-
      When a schema names a range the loader does not recognise, does the
      failure stay on the SLOT, or does it take the whole file and everything
      importing it, silently?
    severity: HERESY
    lesson: >-
      An unknown range fails construction, construction is the first rite, and
      a failed first rite short-circuits the run. So one unrecognised name does
      not reject one slot: it blinds every later rite on that file and on every
      file importing it. Observed: an adopter used a range that is a legal
      built-in of the schema language and simply absent from the loader's
      allowlist; five files of thirteen failed to construct, and seven of eight
      mechanical rites had therefore never executed anywhere in that
      repository, with the report showing one heresy per file and saying
      nothing about what it had skipped. A second, unrelated adopter lost a
      schema to the same gap in the same week on a different type name. Two
      independent fixes: accept the schema language's full set of built-ins,
      because rejecting a legal type punishes an adopter for using their tools
      correctly, and make a construction failure REPORT the rites it prevented
      from running, so the blast radius is visible rather than inferred.

  # Rites earned at home, by inquisiting our own second subpackage. Both name
  # defects the nine mechanical rites cannot see, which is why that subpackage
  # held a purity seal while carrying them.

  - id: classification_is_closed
    question: >-
      Does every slot that classifies draw from a closed vocabulary, or is it a
      free string that classifies nothing?
    severity: SUSPICION
    lesson: >-
      Measured at home: one required classification slot carried 78 distinct
      values across 121 records, 59 of them used exactly once. A vocabulary
      where half the values appear once is free text with a schema slot around
      it. Nothing groups, nothing compares, and every query is a guess about
      spelling. This is the disease constrained_tongues names, in slots that
      rite does not reach: it governs event_type, relation_type and signal_type
      by name because the root leaves those three open on purpose, and a slot
      the domain invented is outside it.

      Judgment tier deliberately. The mechanical form would be a suffix rule
      over slot names, and on the pair that earned this rite a suffix rule
      catches claim_kind and misses coverage_maturity. A gate that catches half
      the instances reads as enforcement and is worth less than an honest
      absence, so the reader decides which slots classify and the rite says
      what to look for: a required slot, range string, no enum, no pattern,
      whose recorded values cluster into a set somebody could have written down.

  - id: provisional_declared
    question: >-
      Can a record say "I am referenced and not yet known", or must every
      reference be resolved before it can be recorded at all?
    severity: NOTE
    status: open_question
    lesson: >-
      A knowledge system with no provisional state offers three moves and all
      three are bad: invent the definition, refuse the passage, or store an
      unresolved string and promise to fix it later. Malleus does not offer the
      capability, so this rite asks and does not condemn. It enters at NOTE for
      the same reason module_declares_its_interface does: condemning an adopter
      for lacking what we do not supply is the defect three self-inquisitions
      removed from our own documents.

      Two consumers found at home, which is what moved this from an idea to a
      rite. First: a concept slot required regardless of review state, so a
      half-known concept cannot be staged at all while a claim with no evidence
      can. Second, and independent: a pointer discovered inside a source and
      not yet fetched. Demonstrated, the edge naming it is REJECTED because the
      target does not exist, and the same edge COMMITS once a stub is invented
      with a fabricated title and a fabricated status. The refusal is right and
      the workaround it forces is the first bad move, taken silently.

      Reference counting may rank such a backlog and must never settle it. A
      concept referenced forty times and never defined is the most important
      open question in the ingest, not thereby defined. Promotion by
      accumulated weight rebuilds a half-open gate on exactly the entities the
      graph leans on hardest.
