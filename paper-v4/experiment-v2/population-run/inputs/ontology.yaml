classes:
  GeoscienceObject:
    abstract: true
    is_a: Entity
    description: Abstract root for source-locatable geoscience domain objects.
    slot_usage:
      name:
        range: string
        required: true

  GeologicFeature:
    is_a: GeoscienceObject
    description: A persistent tectonic, volcanic, hydrothermal, or seafloor feature.
    slots:
      - geologic_feature_kind

  EarthRegion:
    is_a: GeoscienceObject
    description: A persistent region or layer of the solid Earth.
    slots:
      - earth_region_kind

  GeophysicalBoundary:
    is_a: GeoscienceObject
    description: A boundary inferred from thermal, mechanical, or seismic properties.
    slots:
      - geophysical_boundary_kind

  GeologicMaterial:
    is_a: GeoscienceObject
    description: Rock, melt, fluid, gas, sediment, or another geologic material.
    slots:
      - geologic_material_kind

  ChemicalConstituent:
    is_a: GeoscienceObject
    description: A chemical constituent present in or released from geologic material.
    slots:
      - chemical_formula

  GeologicProcess:
    is_a: GeoscienceObject
    description: A physical, chemical, magmatic, hydrothermal, or tectonic process.
    slots:
      - geologic_process_kind

  SeismicPhenomenon:
    is_a: GeoscienceObject
    description: An individual seismic event or an identifiable seismicity population.
    slots:
      - seismic_phenomenon_kind

  GeologicSample:
    is_a: GeoscienceObject
    description: A collected material sample used for petrologic or geochemical analysis.
    slots:
      - geologic_sample_kind

  ObservationMethod:
    is_a: GeoscienceObject
    description: A scientific method used to detect, calculate, estimate, or interpret a domain quantity or state.
    slots:
      - observation_method_kind

  Instrument:
    is_a: GeoscienceObject
    description: A physical instrument used to acquire observations.
    slots:
      - instrument_kind

  ScientificModel:
    is_a: GeoscienceObject
    description: A model used to derive locations, physical states, or expected quantities.
    slots:
      - scientific_model_kind

  DomainObservation:
    abstract: true
    is_a: GeoscienceObject
    description: Abstract root for quantitative and categorical domain observations.

  QuantitativeObservation:
    is_a: DomainObservation
    description: A measured, calculated, estimated, modeled, expected, or compiled numeric interval.
    slots:
      - quantity_kind
      - lower_numeric_value
      - upper_numeric_value
      - measurement_unit
      - observation_basis

  CategoricalObservation:
    is_a: DomainObservation
    description: A measured, observed, or interpreted categorical state.
    slots:
      - categorical_observation_kind
      - categorical_observation_value
      - observation_basis

  FeaturePartOfRelation:
    is_a: Relation
    description: Relates a geologic feature to a larger geologic feature containing it.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: FEATURE_PART_OF
      source_id:
        range: GeologicFeature
        required: true
      target_id:
        range: GeologicFeature
        required: true

  FeatureAdjacentToRelation:
    is_a: Relation
    description: Relates two spatially adjacent geologic features.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: FEATURE_ADJACENT_TO
      source_id:
        range: GeologicFeature
        required: true
      target_id:
        range: GeologicFeature
        required: true

  FeatureOffsetsRelation:
    is_a: Relation
    description: Relates a geologic feature to another feature that it offsets.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: FEATURE_OFFSETS
      source_id:
        range: GeologicFeature
        required: true
      target_id:
        range: GeologicFeature
        required: true

  FeatureContainsRegionRelation:
    is_a: Relation
    description: Relates a geologic feature to an Earth region beneath or within it.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: FEATURE_CONTAINS_REGION
      source_id:
        range: GeologicFeature
        required: true
      target_id:
        range: EarthRegion
        required: true

  FeatureHasBoundaryRelation:
    is_a: Relation
    description: Relates a geologic feature to a geophysical boundary associated with it.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: FEATURE_HAS_BOUNDARY
      source_id:
        range: GeologicFeature
        required: true
      target_id:
        range: GeophysicalBoundary
        required: true

  BoundaryBoundsRegionRelation:
    is_a: Relation
    description: Relates a geophysical boundary to an Earth region that it bounds.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: BOUNDARY_BOUNDS_REGION
      source_id:
        range: GeophysicalBoundary
        required: true
      target_id:
        range: EarthRegion
        required: true

  SeismicPhenomenonOccursAtRelation:
    is_a: Relation
    description: Locates a seismic phenomenon at a geologic feature.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: SEISMIC_PHENOMENON_OCCURS_AT
      source_id:
        range: SeismicPhenomenon
        required: true
      target_id:
        range: GeologicFeature
        required: true

  SeismicPhenomenonOccursInRelation:
    is_a: Relation
    description: Locates a seismic phenomenon within an Earth region.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: SEISMIC_PHENOMENON_OCCURS_IN
      source_id:
        range: SeismicPhenomenon
        required: true
      target_id:
        range: EarthRegion
        required: true

  SeismicPhenomenonAlignedWithFeatureRelation:
    is_a: Relation
    description: Relates a spatially aligned seismic phenomenon and geologic feature.
    slot_usage:
      relation_type:
        range: GeoscienceRelationType
        required: true
        equals_string: SEISMIC_PHENOMENON_ALIGNED_WITH_FEATURE
      source_id:
