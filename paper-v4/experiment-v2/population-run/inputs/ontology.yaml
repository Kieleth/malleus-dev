slots:
  geologic_feature_kind:
    range: GeologicFeatureKind
    required: true
    description: Domain category of a geologic feature.

  earth_region_kind:
    range: EarthRegionKind
    required: true
    description: Domain category of an Earth region.

  geophysical_boundary_kind:
    range: GeophysicalBoundaryKind
    required: true
    description: Domain category of a geophysical boundary.

  geologic_material_kind:
    range: GeologicMaterialKind
    required: true
    description: Domain category of geologic material.

  chemical_formula:
    range: string
    required: true
    description: Chemical formula or elemental symbol identifying a constituent.

  geologic_process_kind:
    range: GeologicProcessKind
    required: true
    description: Domain category of a geologic process.

  seismic_phenomenon_kind:
    range: SeismicPhenomenonKind
    required: true
    description: Domain category of a seismic phenomenon.

  geologic_sample_kind:
    range: GeologicSampleKind
    required: true
    description: Domain category of a geologic sample.

  observation_method_kind:
    range: ObservationMethodKind
    required: true
    description: Domain category of an observation method.

  instrument_kind:
    range: InstrumentKind
    required: true
    description: Domain category of a scientific instrument.

  scientific_model_kind:
    range: ScientificModelKind
    required: true
    description: Domain category of a scientific model.

  quantity_kind:
    range: QuantityKind
    required: true
    description: Physical or observational quantity represented by a quantitative observation.

  lower_numeric_value:
    range: float
    required: true
    description: Inclusive lower bound, equal to the upper bound for an exact value.

  upper_numeric_value:
    range: float
    required: true
    description: Inclusive upper bound, equal to the lower bound for an exact value.

  measurement_unit:
    range: MeasurementUnit
    required: true
    description: Unit applying to both numeric bounds.

  observation_basis:
    range: ObservationBasis
    required: true
    description: How the observation value was obtained.

  categorical_observation_kind:
    range: CategoricalObservationKind
    required: true
    description: Dimension described by a categorical observation.

  categorical_observation_value:
    range: CategoricalObservationValue
    required: true
    description: Categorical state assigned by an observation.
