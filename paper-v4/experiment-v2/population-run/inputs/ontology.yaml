id: https://malleus.dev/domains/mid-ocean-ridge-geodynamics
name: mid_ocean_ridge_geodynamics
version: 0.1.0
title: Mid-Ocean Ridge Geodynamics Ontology Proposal
description: >-
  Proposed reusable vocabulary for tectonic features, mantle and crustal
  regions, melts, volatile constituents, geologic processes, seismic
  phenomena, observations, samples, instruments, methods, and models used in
  studies of mid-ocean ridge geodynamics.

prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  morg: https://malleus.dev/domains/mid-ocean-ridge-geodynamics/

default_range: string

imports:
  - linkml:types
  - malleus

