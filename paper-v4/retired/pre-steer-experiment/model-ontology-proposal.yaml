id: https://malleus.dev/schema/paper-v4-domain-proposal
name: paper_v4_domain_proposal
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  paper4: https://malleus.dev/schema/paper-v4-domain-proposal/

default_range: string

imports:
  - linkml:types
  - malleus

enums:
  PaperRelationType:
    permissible_values:
      ACQUIRED_DURING:
      SPATIALLY_ASSOCIATED_WITH:
      HAS_QUANTITY:
      HAS_COMPONENT:
      CAUSES:
      EXPLAINS:

  DataKind:
    permissible_values:
      MICROSEISMICITY:

  RelativePosition:
    permissible_values:
      BENEATH_RIDGE_AXIS:
      ALONG_RIDGE_SECTION:

  QuantityKind:
    permissible_values:
      EARTHQUAKE_DEPTH:
      PRIMARY_MELT_CO2_CONCENTRATION:

  QuantityUnit:
    permissible_values:
      KILOMETER:
      WEIGHT_PERCENT:

  EpistemicStatus:
    permissible_values:
      REPORTED_OBSERVATION:
      CALCULATED_ESTIMATE:
      PREFERRED_HYPOTHESIS:

  MechanismKind:
    permissible_values:
      ASCENDING_MELT:
      CARBON_DIOXIDE_DEGASSING:
      VOLUME_CHANGE:
      PRESSURE_INCREASE:
      EXTENSIONAL_STRESS:
      LOCAL_HIGH_STRAIN_RATE:
      EARTHQUAKE_TRIGGERING:

classes:
  ObservationNetwork:
    is_a: Entity
    slots:
      - instrument_count
    slot_usage:
      name:
        range: string
        required: true

  Campaign:
    is_a: Entity
    slots:
      - campaign_year
    slot_usage:
      name:
        range: string
        required: true

  RidgeSection:
    is_a: Entity
    slot_usage:
      name:
        range: string
        required: true

  QuantifiedSubject:
    is_a: Entity
    abstract: true

  EarthquakePopulation:
    is_a: QuantifiedSubject
    slot_usage:
      name:
        range: string
        required: true

  MeltPopulation:
    is_a: QuantifiedSubject
    slot_usage:
      name:
        range: string
        required: true

  QuantitativeRange:
    is_a: Entity
    slots:
      - quantity_kind
      - lower_bound
      - upper_bound
      - unit
      - epistemic_status

  CausalHypothesis:
    is_a: Entity
    slots:
      - epistemic_status
    slot_usage:
      name:
        range: string
        required: true
      epistemic_status:
        range: EpistemicStatus
        required: true
        equals_string: PREFERRED_HYPOTHESIS

  MechanismElement:
    is_a: Entity
    slots:
      - mechanism_kind

  DataAcquisitionRelation:
    is_a: Relation
    slots:
      - data_kind
      - epistemic_status
    slot_usage:
      relation_type:
        range: PaperRelationType
        required: true
        equals_string: ACQUIRED_DURING
      source_id:
        range: ObservationNetwork
        required: true
      target_id:
        range: Campaign
        required: true
      epistemic_status:
        range: EpistemicStatus
        required: true
        equals_string: REPORTED_OBSERVATION

  SpatialAssociationRelation:
    is_a: Relation
    slots:
      - relative_position
      - epistemic_status
    slot_usage:
      relation_type:
        range: PaperRelationType
        required: true
        equals_string: SPATIALLY_ASSOCIATED_WITH
      source_id:
        range: QuantifiedSubject
        required: true
      target_id:
        range: RidgeSection
        required: true
      epistemic_status:
        range: EpistemicStatus
        required: true
        equals_string: REPORTED_OBSERVATION

  QuantitySubjectRelation:
    is_a: Relation
    slot_usage:
      relation_type:
        range: PaperRelationType
        required: true
        equals_string: HAS_QUANTITY
      source_id:
        range: QuantifiedSubject
        required: true
      target_id:
        range: QuantitativeRange
        required: true

  HypothesisComponentRelation:
    is_a: Relation
    slot_usage:
      relation_type:
        range: PaperRelationType
        required: true
        equals_string: HAS_COMPONENT
      source_id:
        range: CausalHypothesis
        required: true
      target_id:
        range: MechanismElement
        required: true

  CausalLinkRelation:
    is_a: Relation
    slots:
      - epistemic_status
    slot_usage:
      relation_type:
        range: PaperRelationType
        required: true
        equals_string: CAUSES
      source_id:
        range: MechanismElement
        required: true
      target_id:
        range: MechanismElement
        required: true
      epistemic_status:
        range: EpistemicStatus
        required: true
        equals_string: PREFERRED_HYPOTHESIS

  HypothesisTargetRelation:
    is_a: Relation
    slot_usage:
      relation_type:
        range: PaperRelationType
        required: true
        equals_string: EXPLAINS
      source_id:
        range: CausalHypothesis
        required: true
      target_id:
        range: EarthquakePopulation
        required: true

slots:
  instrument_count:
    range: integer
    required: true
    minimum_value: 1

  campaign_year:
    range: integer
    required: true

  data_kind:
    range: DataKind
    required: true

  relative_position:
    range: RelativePosition
    required: true

  quantity_kind:
    range: QuantityKind
    required: true

  lower_bound:
    range: float
    required: true

  upper_bound:
    range: float
    required: true

  unit:
    range: QuantityUnit
    required: true

  epistemic_status:
    range: EpistemicStatus
    required: true

  mechanism_kind:
    range: MechanismKind
    required: true
