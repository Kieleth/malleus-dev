id: https://malleus.dev/schema/small-shop-fulfilment
name: small_shop_fulfilment
version: 0.3.0-synthetic-partial-shipments
title: Small Shop Fulfilment TBox
description: Synthetic partial-shipment extension, not a release or additional literature data.
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  shop: https://malleus.dev/schema/small-shop-fulfilment/
imports:
  - linkml:types
  - malleus
enums:
  ShopRelationKind:
    permissible_values:
      ORDER_CONTAINS_UNIT:
      PAYMENT_SETTLES_INVOICE:
      ORDER_HAS_SHIPMENT:
      SHIPMENT_CONTAINS_UNIT:
slots:
  order_number:
    range: string
  product_code:
    range: string
  supplier_order_id:
    range: string
  ordered_quantity:
    range: integer
  source_occurrence_id:
    range: string
  invoice_number:
    range: string
  payment_number:
    range: string
  tracking_id:
    range: string
classes:
  SalesOrder:
    is_a: Entity
    slots:
      - order_number
    slot_usage:
      order_number:
        required: true
  InventoryUnit:
    is_a: Entity
    slots:
      - product_code
    slot_usage:
      product_code:
        required: true
  OrderContainsUnit:
    is_a: Relation
    slot_usage:
      relation_type:
        range: ShopRelationKind
        required: true
        equals_string: ORDER_CONTAINS_UNIT
      source_id:
        range: SalesOrder
        required: true
      target_id:
        range: InventoryUnit
        required: true
  SupplierOrderState:
    is_a: Entity
    slots:
      - supplier_order_id
      - product_code
      - ordered_quantity
      - source_occurrence_id
    slot_usage:
      supplier_order_id:
        required: true
      product_code:
        required: true
      ordered_quantity:
        required: true
      source_occurrence_id:
        required: true
  Invoice:
    is_a: Entity
    slots:
      - invoice_number
    slot_usage:
      invoice_number:
        required: true
  Payment:
    is_a: Entity
    slots:
      - payment_number
    slot_usage:
      payment_number:
        required: true
  PaymentSettlesInvoiceRelation:
    is_a: Relation
    slot_usage:
      relation_type:
        range: ShopRelationKind
        required: true
        equals_string: PAYMENT_SETTLES_INVOICE
      source_id:
        range: Payment
        required: true
      target_id:
        range: Invoice
        required: true
  Shipment:
    is_a: Entity
    slots:
      - tracking_id
    slot_usage:
      tracking_id:
        required: true
  OrderHasShipment:
    is_a: Relation
    slot_usage:
      relation_type:
        range: ShopRelationKind
        required: true
        equals_string: ORDER_HAS_SHIPMENT
      source_id:
        range: SalesOrder
        required: true
      target_id:
        range: Shipment
        required: true
  ShipmentContainsUnit:
    is_a: Relation
    slot_usage:
      relation_type:
        range: ShopRelationKind
        required: true
        equals_string: SHIPMENT_CONTAINS_UNIT
      source_id:
        range: Shipment
        required: true
      target_id:
        range: InventoryUnit
        required: true
