id: https://malleus.dev/schema/assent
name: malleus_assent
version: 0.7.0
title: Malleus Assent Protocol Ontology
description: >-
  Structurally enforced records for proposed knowledge, monitoring,
  epistemic decisions, action authorization, requests, revision, execution,
  outcomes, and state transitions. These records do not establish truth.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  assent: https://malleus.dev/schema/assent/

imports:
  - linkml:types
  - malleus

enums:
  ResponsibleRole:
    description: >-
      Closed vocabulary for protocol responsibility. The authority model
      turns on role; an open string here would let any caller claim any
      authority unchecked.
    permissible_values:
      proposer:
      registrar:
      reviewer:
      type-monitor:
      evidence-monitor:
      conflict-monitor:
      uncertainty-monitor:
      temporal-monitor:
      logic-monitor:
      authority-monitor:
      epistemic-controller:
      state-controller:
      authorizer:
      graph-materializer:

  AssessmentOutcome:
    permissible_values:
      SATISFIED:
      VIOLATED:
      UNKNOWN:

  MonitorFailureCategory:
    description: >-
      Why a monitor failed to produce an output. Closed because the arbiter
      must be able to answer "how many deferrals came from a timeout" with a
      query rather than a substring search; free-text reasons are provenance
      that cannot be enforced.
    permissible_values:
      TIMEOUT:
      DEPENDENCY:
      EXECUTION:

  MonitorErrorCode:
    description: >-
      The specific failure a monitor reports. Closed for the same reason as
      the category, and paired with error_message, which stays free text and
      carries the detail. A new code is added here, never invented at a call
      site.
    permissible_values:
      DEADLINE:
      ENGINE_TIMEOUT:
      ENGINE_FAILED:
      FAILED:
      AUTHORITY_SOURCE_UNAVAILABLE:

  LogicCheckOutcome:
    permissible_values:
      SATISFIED:
      VIOLATED:

  AssessmentKind:
    permissible_values:
      TYPE:
      EVIDENCE_COMPLETENESS:
      CONFLICT:
      UNCERTAINTY:
      LOGICAL:
      TEMPORAL:
      AUTHORITY:

  EpistemicVerdict:
    permissible_values:
      ACCEPT:
      REJECT:
      DEFER:
      CONTEST:

  ViolationEpistemicVerdict:
    permissible_values:
      REJECT:
      DEFER:
      CONTEST:

  UnknownEpistemicVerdict:
    permissible_values:
      DEFER:
      CONTEST:

  AuthorizationVerdict:
    permissible_values:
      AUTHORIZE:
      BLOCK:
      CLARIFY:

  RequestState:
    permissible_values:
      OPEN:
      FULFILLED:
      CANCELLED:

  EvidencePolarity:
    permissible_values:
      SUPPORTS:
      CONTRADICTS:
      QUALIFIES:

  ExecutionStatus:
    permissible_values:
      STARTED:
      SUCCEEDED:
      FAILED:
      ABORTED:

  ArtifactKind:
    permissible_values:
      GRAPH_BASE:
      CANDIDATE_SUBGRAPH:
      MONITOR_SPECIFICATION:
      EPISTEMIC_POLICY:
      AUTHORIZATION_POLICY:
      RULE_SET:
      LOGIC_CONTRACT:
      EVIDENCE_CONTRACT:
      CONFLICT_RULE:
      UNCERTAINTY_CONTRACT:
      TEMPORAL_CONTRACT:
      AUTHORITY_GRANT:

classes:
  ProtocolRecord:
    abstract: true
    is_a: Entity
    description: >-
      Immutable record produced by an identified activity. The fields encode
      record provenance but are not a claim of formal PROV-O conformance.
    slots:
      - content_hash
      - generation_event_id
      - generated_at
      - responsible_actor_id
      - responsible_role
      - source_record_ids
    slot_usage:
      content_hash:
        required: true
      generation_event_id:
        required: true
      generated_at:
        required: true
      responsible_actor_id:
        required: true
      responsible_role:
        required: true

  ProtocolActor:
    is_a: Entity
    mixins:
      - Agent
    description: >-
      An identified actor that can bear protocol responsibility: a proposer,
      monitor, controller, or reviewer. Adopters register their actors as
      ProtocolActor records; responsible_actor_id on protocol records names
      one. The id slot stays a string range deliberately: actor records live
      in the adopter's graph, not in every ledger.
    slot_usage:
      agent_type:
        range: ResponsibleRole
        required: true

  ProtocolArtifact:
    is_a: ProtocolRecord
    slots:
      - artifact_kind
      - artifact_version
      - artifact_hash
    slot_usage:
      artifact_kind:
        required: true
      artifact_version:
        required: true
      artifact_hash:
        required: true

  MonitorSpecificationArtifact:
    is_a: ProtocolArtifact
    description: >-
      Replay-visible specification of one exact monitor implementation and its
      input artifacts. This record does not claim that the monitor executed.
    slots:
      - monitor_schema_version
      - assessment_kind
      - monitor_implementation_hash
      - input_artifact_ids
      - input_artifact_record_hashes
    slot_usage:
      artifact_kind:
        equals_string: MONITOR_SPECIFICATION
      monitor_schema_version:
        required: true
        equals_string: "1"
      assessment_kind:
        required: true
      monitor_implementation_hash:
        required: true

  EpistemicPolicyArtifact:
    is_a: ProtocolArtifact
    description: >-
      Deterministic mapping from exact required monitor outputs to one
      epistemic verdict.
    slots:
      - policy_schema_version
      - ruleset_id
      - ruleset_record_hash
      - ruleset_artifact_hash
      - required_monitor_ids
      - required_monitor_record_hashes
      - violation_verdicts
      - unknown_verdicts
      - control_precedence
    slot_usage:
      artifact_kind:
        equals_string: EPISTEMIC_POLICY
      policy_schema_version:
        required: true
        equals_string: "1"
      ruleset_id:
        required: true
      ruleset_record_hash:
        required: true
      ruleset_artifact_hash:
        required: true
      required_monitor_ids:
        required: true
      required_monitor_record_hashes:
        required: true
      violation_verdicts:
        required: true
      unknown_verdicts:
        required: true
      control_precedence:
        required: true

  AuthorizationPolicyArtifact:
    is_a: ProtocolArtifact
    description: >-
      Deterministic authorization control policy bound to an exact set of
      authority monitors before an action is proposed.
    slots:
      - policy_schema_version
      - required_monitor_ids
      - required_monitor_record_hashes
    slot_usage:
      artifact_kind:
        equals_string: AUTHORIZATION_POLICY
      policy_schema_version:
        required: true
        equals_string: "1"
      required_monitor_ids:
        required: true
      required_monitor_record_hashes:
        required: true

  LogicContractArtifact:
    is_a: ProtocolArtifact
    description: >-
      Replay-visible semantic fields for a pinned logic contract. The artifact
      hash is the canonical semantic contract digest.
    slots:
      - logic_contract_schema_version
      - ontology_hash
      - fact_contract_version
      - ruleset_id
      - ruleset_version
      - ruleset_record_hash
      - ruleset_artifact_hash
      - rule_ids
      - timeout_seconds
    slot_usage:
      artifact_kind:
        equals_string: LOGIC_CONTRACT
      logic_contract_schema_version:
        required: true
        equals_string: "1"
      ontology_hash:
        required: true
      fact_contract_version:
        required: true
        equals_string: "2"
      ruleset_id:
        required: true
      ruleset_version:
        required: true
      ruleset_record_hash:
        required: true
      ruleset_artifact_hash:
        required: true
      rule_ids:
        required: true
      timeout_seconds:
        required: true

  GraphBaseArtifact:
    is_a: ProtocolArtifact
    description: >-
      Content-addressed declaration of the external graph used to seed accepted
      graph replay. The graph itself must be supplied and independently match
      these commitments.
    slots:
      - graph_schema_version
      - graph_ontology_hash
      - base_state_digest
      - base_record_metadata
      - base_record_count
    slot_usage:
      artifact_kind:
        equals_string: GRAPH_BASE
      graph_schema_version:
        required: true
        equals_string: "1"
      graph_ontology_hash:
        required: true
      base_state_digest:
        required: true
      base_record_metadata:
        required: true
      base_record_count:
        required: true

  CandidateSubgraphArtifact:
    is_a: ProtocolArtifact
    description: >-
      Exact ordered graph writes and temporal envelopes staged against one
      accepted graph state. A digest-only candidate is not replayable.
    slots:
      - candidate_schema_version
      - graph_base_id
      - graph_base_hash
      - graph_ontology_hash
      - base_acceptance_head
      - base_materialization_head
      - base_state_digest
      - candidate_manifest
      - candidate_manifest_hash
      - candidate_write_count
      - candidate_digest
      - candidate_state_digest
    slot_usage:
      artifact_kind:
        equals_string: CANDIDATE_SUBGRAPH
      candidate_schema_version:
        required: true
        equals_string: "1"
      graph_base_id:
        required: true
      graph_base_hash:
        required: true
      graph_ontology_hash:
        required: true
      base_acceptance_head:
        required: true
      base_materialization_head:
        required: true
      base_state_digest:
        required: true
      candidate_manifest:
        required: true
      candidate_manifest_hash:
        required: true
      candidate_write_count:
        required: true
      candidate_digest:
        required: true
      candidate_state_digest:
        required: true

  AuthorityGrant:
    is_a: ProtocolArtifact
    slots:
      - grantor_actor_id
      - grantee_actor_id
      - permitted_action_types
      - grant_valid_from
      - grant_valid_to
    slot_usage:
      artifact_kind:
        equals_string: AUTHORITY_GRANT
      grantor_actor_id:
        required: true
      grantee_actor_id:
        required: true
      permitted_action_types:
        required: true
      grant_valid_from:
        required: true

  ProposedSubgraph:
    is_a: ProtocolRecord
    slots:
      - revision
      - proposal_key
      - revises_proposal_id
      - base_acceptance_head
      - epistemic_policy_id
      - epistemic_policy_hash
      - member_content_hashes
      - claim_version_ids
      - evidence_ids
      - evidence_assertion_ids
      - action_proposal_ids
      - candidate_artifact_id
      - candidate_artifact_hash
      - candidate_digest
    slot_usage:
      revision:
        required: true
      proposal_key:
        required: true
      base_acceptance_head:
        required: true
      epistemic_policy_id:
        required: true
      epistemic_policy_hash:
        required: true
      member_content_hashes:
        required: true

  ClaimVersion:
    is_a: ProtocolRecord
    slots:
      - claim_key
      - revision
      - revises_claim_version_id
      - statement
      - domain_valid_from
      - domain_valid_to
      - dependency_ids
    slot_usage:
      claim_key:
        required: true
      revision:
        required: true
      statement:
        required: true
      domain_valid_from:
        required: true

  Evidence:
    is_a: ProtocolRecord
    slots:
      - evidence_kind
      - source_version_id
      - locator
      - request_id
    slot_usage:
      evidence_kind:
        required: true
      source_version_id:
        required: true
      locator:
        required: true

  EvidenceAssertion:
    is_a: ProtocolRecord
    slots:
      - claim_version_id
      - evidence_id
      - evidence_polarity
      - rationale
    slot_usage:
      claim_version_id:
        required: true
      evidence_id:
        required: true
      evidence_polarity:
        required: true
      rationale:
        required: true

  ActionProposal:
    abstract: true
    is_a: ProtocolRecord
    description: Domain ontologies define concrete action payload types.
    slots:
      - action_type
      - action_payload_hash
      - action_key
      - revision
      - revises_action_proposal_id
      - authorization_policy_id
      - authorization_policy_hash
    slot_usage:
      action_type:
        required: true
      action_payload_hash:
        required: true
      action_key:
        required: true
      revision:
        required: true
      authorization_policy_id:
        required: true
      authorization_policy_hash:
        required: true

  Assessment:
    abstract: true
    is_a: ProtocolRecord
    slots:
      - proposal_id
      - proposal_content_hash
      - base_acceptance_head
      - assessment_kind
      - assessment_outcome
      - monitor_id
      - monitor_version
      - monitor_hash
      - monitor_failure_id
      - input_record_ids
      - reason_codes
      - rationale
    slot_usage:
      proposal_id:
        required: true
      proposal_content_hash:
        required: true
      base_acceptance_head:
        required: true
      assessment_kind:
        required: true
      assessment_outcome:
        required: true
      monitor_id:
        required: true
      monitor_version:
        required: true
      monitor_hash:
        required: true
      input_record_ids:
        required: true
      reason_codes:
        required: true
      rationale:
        required: true

  UnavailableAssessment:
    is_a: Assessment
    description: >-
      Explicit UNKNOWN output paired atomically with a MonitorFailure. It is
      not a completed monitor result.
    slots:
      - logic_contract_id
      - logic_contract_record_hash
      - ruleset_id
      - ruleset_hash
    slot_usage:
      assessment_outcome:
        equals_string: UNKNOWN

  UnavailableAuthorityAssessment:
    is_a: UnavailableAssessment
    description: >-
      UNKNOWN authority output paired atomically with a MonitorFailure and
      bound to the exact action, actor, policy, and optional evaluated grant.
    slots:
      - action_proposal_id
      - action_content_hash
      - evaluated_actor_id
      - authority_policy_id
      - authority_policy_hash
      - evaluated_authority_grant_id
      - evaluated_authority_grant_hash
    slot_usage:
      assessment_kind:
        equals_string: AUTHORITY
      action_proposal_id:
        required: true
      action_content_hash:
        required: true
      evaluated_actor_id:
        required: true
      authority_policy_id:
        required: true
      authority_policy_hash:
        required: true

  TypeAssessment:
    is_a: Assessment
    slot_usage:
      assessment_kind:
        equals_string: TYPE

  EvidenceCompletenessAssessment:
    is_a: Assessment
    slots:
      - evidence_contract_id
      - evidence_contract_hash
      - missing_requirement_ids
    slot_usage:
      assessment_kind:
        equals_string: EVIDENCE_COMPLETENESS
      evidence_contract_id:
        required: true
      evidence_contract_hash:
        required: true

  ConflictAssessment:
    is_a: Assessment
    slots:
      - conflicting_assertion_ids
      - conflict_rule_id
      - conflict_rule_hash
    slot_usage:
      assessment_kind:
        equals_string: CONFLICT
      conflict_rule_id:
        required: true
      conflict_rule_hash:
        required: true

  UncertaintyAssessment:
    is_a: Assessment
    slots:
      - uncertainty_contract_id
      - uncertainty_contract_hash
    slot_usage:
      assessment_kind:
        equals_string: UNCERTAINTY
      uncertainty_contract_id:
        required: true
      uncertainty_contract_hash:
        required: true

  LogicalAssessment:
    is_a: Assessment
    slots:
      - checked_rule_ids
      - violated_rule_ids
      - logic_check_record_ids
      - logic_contract_id
      - logic_contract_record_hash
      - ruleset_id
      - ruleset_hash
    slot_usage:
      assessment_kind:
        equals_string: LOGICAL
      logic_contract_id:
        required: true
      logic_contract_record_hash:
        required: true
      ruleset_id:
        required: true
      ruleset_hash:
        required: true

  LogicCheckRecord:
    is_a: ProtocolRecord
    description: >-
      Immutable evidence of one completed logic-engine execution. This record
      is not a formal proof certificate.
    slots:
      - proposal_id
      - proposal_content_hash
      - base_acceptance_head
      - monitor_id
      - monitor_version
      - monitor_hash
      - candidate_digest
      - base_state_digest
      - candidate_state_digest
      - context_state_digests
      - ontology_hash
      - fact_contract_version
      - logic_contract_id
      - logic_contract_version
      - logic_contract_record_hash
      - logic_contract_artifact_hash
      - ruleset_id
      - ruleset_version
      - ruleset_record_hash
      - ruleset_artifact_hash
      - engine_name
      - engine_version
      - timeout_seconds
      - facts_hash
      - fact_count
      - translated_record_ids
      - checked_rule_ids
      - violated_rule_ids
      - violation_witness_ids
      - check_outcome
    slot_usage:
      proposal_id:
        required: true
      proposal_content_hash:
        required: true
      base_acceptance_head:
        required: true
      monitor_id:
        required: true
      monitor_version:
        required: true
      monitor_hash:
        required: true
      candidate_digest:
        required: true
      base_state_digest:
        required: true
      candidate_state_digest:
        required: true
      ontology_hash:
        required: true
      fact_contract_version:
        required: true
        equals_string: "2"
      logic_contract_id:
        required: true
      logic_contract_version:
        required: true
      logic_contract_record_hash:
        required: true
      logic_contract_artifact_hash:
        required: true
      ruleset_id:
        required: true
      ruleset_version:
        required: true
      ruleset_record_hash:
        required: true
      ruleset_artifact_hash:
        required: true
      engine_name:
        required: true
      engine_version:
        required: true
      timeout_seconds:
        required: true
      facts_hash:
        required: true
      fact_count:
        required: true
      check_outcome:
        required: true

  ViolationWitness:
    is_a: ProtocolRecord
    slots:
      - logic_check_id
      - rule_id
      - violation_code
      - witness_record_ids
      - witness_binding_hash
    slot_usage:
      logic_check_id:
        required: true
      rule_id:
        required: true
      violation_code:
        required: true
      witness_binding_hash:
        required: true

  TemporalAssessment:
    is_a: Assessment
    slots:
      - temporal_contract_id
      - temporal_contract_hash
    slot_usage:
      assessment_kind:
        equals_string: TEMPORAL
      temporal_contract_id:
        required: true
      temporal_contract_hash:
        required: true

  AuthorityAssessment:
    is_a: Assessment
    slots:
      - action_proposal_id
      - action_content_hash
      - evaluated_actor_id
      - authority_policy_id
      - authority_policy_hash
      - evaluated_authority_grant_id
      - evaluated_authority_grant_hash
      - checked_policy_predicates
      - violated_policy_predicates
    slot_usage:
      assessment_kind:
        equals_string: AUTHORITY
      action_proposal_id:
        required: true
      action_content_hash:
        required: true
      evaluated_actor_id:
        required: true
      authority_policy_id:
        required: true
      authority_policy_hash:
        required: true
      checked_policy_predicates:
        required: true

  MonitorFailure:
    is_a: ProtocolRecord
    description: A monitoring failure report, never negative evidence.
    slots:
      - proposal_id
      - proposal_content_hash
      - base_acceptance_head
      - monitor_id
      - monitor_version
      - monitor_hash
      - logic_contract_id
      - logic_contract_record_hash
      - ruleset_id
      - ruleset_hash
      - action_proposal_id
      - action_content_hash
      - evaluated_actor_id
      - authority_policy_id
      - authority_policy_hash
      - evaluated_authority_grant_id
      - evaluated_authority_grant_hash
      - failed_assessment_kind
      - failure_category
      - error_code
      - error_message
    slot_usage:
      proposal_id:
        required: true
      proposal_content_hash:
        required: true
      base_acceptance_head:
        required: true
      monitor_id:
        required: true
      monitor_version:
        required: true
      monitor_hash:
        required: true
      failed_assessment_kind:
        required: true
      failure_category:
        required: true
      error_code:
        required: true
      error_message:
        required: true

  Decision:
    abstract: true
    is_a: ProtocolRecord
    slots:
      - base_acceptance_head
      - policy_id
      - policy_hash
      - rationale_codes
      - rationale
    slot_usage:
      base_acceptance_head:
        required: true
      policy_id:
        required: true
      policy_hash:
        required: true
      rationale_codes:
        required: true
      rationale:
        required: true

  EpistemicDecision:
    is_a: Decision
    slots:
      - proposal_id
      - proposal_content_hash
      - epistemic_verdict
      - assessment_ids
      - triggered_assessment_ids
      - policy_evaluation_hash
      - evidence_assertion_ids
      - request_ids
      - claim_revision_ids
      - ruleset_id
      - ruleset_hash
      - candidate_artifact_id
      - candidate_artifact_hash
      - candidate_digest
      - accepted_application_id
    slot_usage:
      proposal_id:
        required: true
      proposal_content_hash:
        required: true
      epistemic_verdict:
        required: true
      assessment_ids:
        required: true
      policy_evaluation_hash:
        required: true
      ruleset_id:
        required: true
      ruleset_hash:
        required: true

  AcceptedGraphApplication:
    is_a: ProtocolRecord
    description: >-
      Atomic binding of one accepted decision to the exact candidate applied
      during the same ledger event. This records knowledge commitment, not
      action authorization or execution.
    slots:
      - proposal_id
      - proposal_content_hash
      - epistemic_decision_id
      - epistemic_decision_hash
      - candidate_artifact_id
      - candidate_artifact_hash
      - candidate_digest
      - candidate_manifest_hash
      - graph_ontology_hash
      - previous_acceptance_head
      - result_acceptance_head
      - previous_materialization_head
      - result_materialization_head
      - base_state_digest
      - candidate_state_digest
      - applied_record_ids
    slot_usage:
      proposal_id:
        required: true
      proposal_content_hash:
        required: true
      epistemic_decision_id:
        required: true
      epistemic_decision_hash:
        required: true
      candidate_artifact_id:
        required: true
      candidate_artifact_hash:
        required: true
      candidate_digest:
        required: true
      candidate_manifest_hash:
        required: true
      graph_ontology_hash:
        required: true
      previous_acceptance_head:
        required: true
      result_acceptance_head:
        required: true
      previous_materialization_head:
        required: true
      result_materialization_head:
        required: true
      base_state_digest:
        required: true
      candidate_state_digest:
        required: true
      applied_record_ids:
        required: true

  AuthorizationDecision:
    is_a: Decision
    slots:
      - action_proposal_id
      - action_content_hash
      - authorization_verdict
      - epistemic_decision_ids
      - relied_on_claim_version_ids
      - authority_assessment_ids
      - triggered_assessment_ids
      - policy_evaluation_hash
      - authority_grant_id
      - authority_grant_hash
      - authorized_actor_id
      - authorization_valid_from
      - authorization_valid_to
    slot_usage:
      action_proposal_id:
        required: true
      action_content_hash:
        required: true
      authorization_verdict:
        required: true
      epistemic_decision_ids:
        required: true
      relied_on_claim_version_ids:
        required: true
      authority_assessment_ids:
        required: true
      policy_evaluation_hash:
        required: true
      authorized_actor_id:
        required: true

  Request:
    abstract: true
    is_a: ProtocolRecord
    slots:
      - triggering_decision_id
      - target_proposal_id
      - request_contract_id
      - request_contract_hash
      - requested_by_actor_id
      - intended_recipient_id
      - intended_role
      - issued_at
      - expires_at
      - request_state
    slot_usage:
      triggering_decision_id:
        required: true
      target_proposal_id:
        required: true
      request_contract_id:
        required: true
      request_contract_hash:
        required: true
      requested_by_actor_id:
        required: true
      intended_role:
        required: true
      issued_at:
        required: true
      request_state:
        required: true
        equals_string: OPEN

  EvidenceRequest:
    is_a: Request

  HumanReviewRequest:
    is_a: Request
    slots:
      - review_question
      - reviewer_authority_requirement
    slot_usage:
      review_question:
        required: true
      reviewer_authority_requirement:
        required: true

  ReviewReport:
    is_a: ProtocolRecord
    slots:
      - request_id
      - reviewer_id
      - review_outcome
      - rationale
    slot_usage:
      request_id:
        required: true
      reviewer_id:
        required: true
      review_outcome:
        required: true
      rationale:
        required: true

  ClaimRevision:
    is_a: ProtocolRecord
    slots:
      - replaced_claim_version_id
      - replacement_claim_version_id
      - triggering_decision_id
      - revision_justification
      - dependency_ids
      - replacement_valid_from
      - replaced_valid_to
    slot_usage:
      replaced_claim_version_id:
        required: true
      replacement_claim_version_id:
        required: true
      triggering_decision_id:
        required: true
      revision_justification:
        required: true
      replacement_valid_from:
        required: true
      replaced_valid_to:
        required: true

  TransitionRecord:
    is_a: ProtocolRecord
    slots:
      - transition_subject_id
      - from_state
      - to_state
      - triggering_record_id
      - ledger_event_id
      - sequence
      - transition_time
    slot_usage:
      transition_subject_id:
        required: true
      from_state:
        required: true
      to_state:
        required: true
      triggering_record_id:
        required: true
      ledger_event_id:
        required: true
      sequence:
        required: true
      transition_time:
        required: true

  ActionExecution:
    is_a: ProtocolRecord
    slots:
      - action_proposal_id
      - action_content_hash
      - authorization_decision_id
      - executor_id
      - base_acceptance_head
      - execution_started_at
      - execution_ended_at
      - execution_status
    slot_usage:
      action_proposal_id:
        required: true
      action_content_hash:
        required: true
      authorization_decision_id:
        required: true
      executor_id:
        required: true
      base_acceptance_head:
        required: true
      execution_started_at:
        required: true
      execution_status:
        required: true

  OutcomeObservation:
    is_a: ProtocolRecord
    slots:
      - execution_id
      - observer_id
      - observation_type
      - observed_at
      - evidence_ids
    slot_usage:
      execution_id:
        required: true
      observer_id:
        required: true
      observation_type:
        required: true
      observed_at:
        required: true
      evidence_ids:
        required: true

