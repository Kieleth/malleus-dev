    range: string
  authority_policy_hash:
    range: string
  checked_policy_predicates:
    range: string
    multivalued: true
  violated_policy_predicates:
    range: string
    multivalued: true
  failed_assessment_kind:
    range: AssessmentKind
  failure_category:
    range: string
  error_code:
    range: string
  error_message:
    range: string

  policy_id:
    range: string
  policy_hash:
    range: string
  rationale_codes:
    range: string
    multivalued: true
  epistemic_verdict:
    range: EpistemicVerdict
  assessment_ids:
    range: string
    multivalued: true
  request_ids:
