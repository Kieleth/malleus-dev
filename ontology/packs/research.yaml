id: https://malleus.dev/schema/packs/research
name: malleus_research
version: 0.2.0
title: Malleus Research Knowledge Pack
description: >-
  Optional reusable vocabulary for attributed claims, observations, methods,
  instruments, investigations, samples, sources, and evidence. Source
  modality remains a domain fact. It is separate from protocol acceptance.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  research: https://malleus.dev/schema/packs/research/

imports:
  - linkml:types
  - malleus
  - metrology
  - chronology

annotations:
  grounding:
    tag: grounding
    value:
      area: Research and experimental development
      taxonomy: DDC 001.4
      vocabularies:
        - vocabulary: W3C SOSA/SSN
          vocabulary_url: https://www.w3.org/TR/vocab-ssn/
          borrowed_terms:
            - Observation
            - Sample
        - vocabulary: JCGM 200:2012 (VIM), 3rd edition
          vocabulary_url: https://www.bipm.org/documents/20126/2071204/JCGM_200_2012.pdf
          borrowed_terms:
            - measuring instrument
        - vocabulary: OECD Frascati Manual 2015
          vocabulary_url: https://doi.org/10.1787/9789264239012-en
          borrowed_terms:
            - research and experimental development
            - investigation
            - method
        - vocabulary: SEPIO
          vocabulary_url: https://ceur-ws.org/Vol-1747/IT605_ICBO2016.pdf
          borrowed_terms:
            - assertion
            - Data Item
            - Evidence Line
            - support
            - refute
        - vocabulary: Micropublications semantic model
          vocabulary_url: https://doi.org/10.1186/2041-1480-5-28
          borrowed_terms:
            - Claim
            - Evidence
            - support
            - challenge
        - vocabulary: DCMI Metadata Terms
          vocabulary_url: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/
          borrowed_terms:
            - license
      invented_terms:
        - Campaign
        - Instrument
      invention_search: >-
        The cited SOSA/SSN, VIM, Frascati, SEPIO, and Micropublications
        vocabularies were checked for exact generic Campaign and Instrument
        classes. SOSA/SSN uses Sensor, VIM uses measuring instrument, and no
        exact generic Campaign class was found. The accepted pack keeps the
        shorter local class names and records that choice here.

enums:
  AssertionModality:
    description: Coarse shared modality of what a source asserts.
    permissible_values:
      STATED:
      MEASURED:
      CALCULATED:
      HYPOTHESISED:
      CONTESTED:
      NEGATED:

  ResearchRelationType:
    description: Generic relation predicates supplied by the research pack.
    permissible_values:
      CLAIM_CONCERNS:
      OBSERVED_WITH:
      PART_OF_CAMPAIGN:
      SAMPLED_FROM:
      SUPPORTS:
      CHALLENGES:
      REPORTED_BY:

classes:
  SourceAsserted:
    mixin: true
    description: >-
      Source-level modality, optional confidence, and the route and digest that
      reach the retained assertion behind a record. Worn by every claim-bearing
      record, so the route travels with the claim rather than with a copy of
      its text.
    slots:
      - assertion_modality
      - assertion_confidence
      - assertion_locator
      - statement_sha256

  Claim:
    is_a: Entity
    mixins:
      - SourceAsserted
    description: >-
      An attributed statement represented as a graph entity. statement is
      optional and stays empty unless the record's Source declares a licence
      that permits reproducing the sentence; assertion_locator and
      statement_sha256 carry the assertion either way.
    slots:
      - statement
      - claim_kind

  Observation:
    is_a: Entity
    mixins:
      - Quantified
      - TemporalExtent
      - SourceAsserted
    description: A source-attributed observation with optional quantity and time.

  Method:
    is_a: Entity
    description: A method named by a source or investigation.

  Instrument:
    is_a: Entity
    description: An instrument used to produce an observation.

  Campaign:
    is_a: Entity
    mixins:
      - TemporalExtent
      - Counted
    description: A bounded research activity such as an observing campaign or study.

  Sample:
    is_a: Entity
    description: A sample observed or analysed by an investigation.

  Source:
    is_a: Entity
    description: A work or document that reports domain assertions.
    slots:
      - licence

  Evidence:
    is_a: Entity
    description: A retained reference from a graph statement back to source material.
    slots:
      - locator
      - source_digest

  ResearchRelation:
    is_a: Relation
    description: A typed research relation between graph entities.
    slot_usage:
      relation_type:
        range: ResearchRelationType

slots:
  assertion_modality:
    range: AssertionModality
    description: What the source says and how it says it, not whether Malleus accepts it.
  assertion_confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Optional confidence stated by the source or adopter.
  claim_kind:
    range: string
    description: Project-defined refinement of a claim.
  assertion_locator:
    range: string
    description: >-
      Opaque route back to the retained assertion this record formalizes: an
      assertion id, a block id, a byte range, a time span in a recording. The
      pack does not interpret it and never assumes the source is a document.
  statement_sha256:
    range: string
    description: >-
      Digest of the exact retained assertion text, sha256: followed by 64
      lowercase hexadecimal characters. It compares two records against one
      assertion without the graph carrying the sentence.
  licence:
    range: string
    description: >-
      Licence the source declares for its own text, as the source declares it.
      Reproducing a source sentence in statement requires one that permits it;
      absent a licence, the sentence stays out of graph state.
  source_digest:
    range: string
    description: Digest of exact retained source bytes.
