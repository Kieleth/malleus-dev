id: https://malleus.dev/schema/packs/research
name: malleus_research
version: 0.5.0
title: Malleus Research Knowledge Pack
description: >-
  Optional reusable vocabulary for attributed claims, observations, methods,
  instruments, investigations, samples, sources, and evidence. Source
  modality remains a domain fact. It is separate from protocol acceptance.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  research: https://malleus.dev/schema/packs/research/

imports:
  - linkml:types
  - malleus
  - metrology
  - chronology

annotations:
  grounding:
    tag: grounding
    value:
      area: Research and experimental development
      taxonomy: DDC 001.4
      vocabularies:
        - vocabulary: W3C SOSA/SSN
          vocabulary_url: https://www.w3.org/TR/vocab-ssn/
          borrowed_terms:
            - Observation
            - Sample
        - vocabulary: JCGM 200:2012 (VIM), 3rd edition
          vocabulary_url: https://www.bipm.org/documents/20126/2071204/JCGM_200_2012.pdf
          borrowed_terms:
            - measuring instrument
        - vocabulary: OECD Frascati Manual 2015
          vocabulary_url: https://doi.org/10.1787/9789264239012-en
          borrowed_terms:
            - research and experimental development
            - investigation
            - method
        - vocabulary: SEPIO
          vocabulary_url: https://ceur-ws.org/Vol-1747/IT605_ICBO2016.pdf
          borrowed_terms:
            - assertion
            - Data Item
            - Evidence Line
            - support
            - refute
        - vocabulary: Micropublications semantic model
          vocabulary_url: https://doi.org/10.1186/2041-1480-5-28
          borrowed_terms:
            - Claim
            - Evidence
            - support
            - challenge
        - vocabulary: W3C RDF 1.1 Concepts and Abstract Syntax
          vocabulary_url: https://www.w3.org/TR/rdf11-concepts/
          borrowed_terms:
            - subject
        - vocabulary: DCMI Metadata Terms
          vocabulary_url: https://www.dublincore.org/specifications/dublin-core/dcmi-terms/
          borrowed_terms:
            - license
        - vocabulary: ANSI/NISO Z39.104-2022, CRediT, Contributor Roles Taxonomy
          vocabulary_url: https://credit.niso.org/
          borrowed_terms:
            - Conceptualization
            - Data curation
            - Formal analysis
            - Funding acquisition
            - Investigation
            - Methodology
            - Project administration
            - Resources
            - Software
            - Supervision
            - Validation
            - Visualization
            - Writing – original draft
            - Writing – review & editing
      invented_terms:
        - Campaign
        - Contribution
        - ContributionRelation
        - Evaluative
        - HypothesisDisposition
        - Instrument
      invention_search: >-
        The cited SOSA/SSN, VIM, Frascati, SEPIO, and Micropublications
        vocabularies were checked for exact generic Campaign and Instrument
        classes. SOSA/SSN uses Sensor, VIM uses measuring instrument, and no
        exact generic Campaign class was found. The accepted pack keeps the
        shorter local class names and records that choice here. CRediT names
        the fourteen roles and defines each, and ContributorRole follows its
        naming, but it is a term list with no classes, so the mixin
        Contribution and the class ContributionRelation that carry a role in a
        graph are local shapes and are recorded here. The same five
        vocabularies were checked for what a source does with a hypothesis it
        has raised. SEPIO models an assertion's evidence lines and their
        support or refutation, and Micropublications models one statement
        supporting or challenging another; both describe a relation between
        two things, not the source's own disposition of its own hypothesis.
        No term was found for it, so the enum HypothesisDisposition and the
        mixin Evaluative that marks which slots carry such a value are local
        and are recorded here. The same vocabularies were checked for what a
        record's assertion is about. SOSA/SSN defines feature of interest,
        the thing whose property an observation estimates, which fits an
        observation and not a claim, a count or an asserted ratio, and RDF 1.1
        Concepts defines subject as the position a statement is about, for
        every statement and not only a measurement. The pack borrows the RDF
        term, so subject is cited rather than invented and feature of interest
        is recorded here as the narrower term that was considered.

enums:
  AssertionModality:
    description: Coarse shared modality of what a source asserts.
    permissible_values:
      STATED:
      MEASURED:
      CALCULATED:
      HYPOTHESISED:
      CONTESTED:
      NEGATED:

  ContributorRole:
    description: >-
      The role in which a source credits a contributor to a work. Every value
      except OTHER is a role of the CRediT Contributor Roles Taxonomy,
      ANSI/NISO Z39.104-2022, carrying that taxonomy's own definition. OTHER is
      local and records a contribution the taxonomy does not name. A record
      carries the role the source declares, never one inferred from the work.
    permissible_values:
      CONCEPTUALIZATION:
        description: >-
          Ideas; formulation or evolution of overarching research goals and
          aims.
      DATA_CURATION:
        description: >-
          Management activities to annotate (produce metadata), scrub data and
          maintain research data (including software code, where it is
          necessary for interpreting the data itself) for initial use and later
          re-use.
      FORMAL_ANALYSIS:
        description: >-
          Application of statistical, mathematical, computational, or other
          formal techniques to analyze or synthesize study data.
      FUNDING_ACQUISITION:
        description: >-
          Acquisition of the financial support for the project leading to this
          publication.
      INVESTIGATION:
        description: >-
          Conducting a research and investigation process, specifically
          performing the experiments, or data/evidence collection.
      METHODOLOGY:
        description: >-
          Development or design of methodology; creation of models.
      PROJECT_ADMINISTRATION:
        description: >-
          Management and coordination responsibility for the research activity
          planning and execution.
      RESOURCES:
        description: >-
          Provision of study materials, reagents, materials, patients,
          laboratory samples, animals, instrumentation, computing resources, or
          other analysis tools.
      SOFTWARE:
        description: >-
          Programming, software development; designing computer programs;
          implementation of the computer code and supporting algorithms;
          testing of existing code components.
      SUPERVISION:
        description: >-
          Oversight and leadership responsibility for the research activity
          planning and execution, including mentorship external to the core
          team.
      VALIDATION:
        description: >-
          Verification, whether as a part of the activity or separate, of the
          overall replication/reproducibility of results/experiments and other
          research outputs.
      VISUALIZATION:
        description: >-
          Preparation, creation and/or presentation of the published work,
          specifically visualization/data presentation.
      WRITING_ORIGINAL_DRAFT:
        description: >-
          Preparation, creation and/or presentation of the published work,
          specifically writing the initial draft (including substantive
          translation).
      WRITING_REVIEW_AND_EDITING:
        description: >-
          Preparation, creation and/or presentation of the published work by
          those from the original research group, specifically critical review,
          commentary or revision – including pre- or post-publication stages.
      OTHER:
        description: >-
          The source states a contribution the taxonomy does not name.

  HypothesisDisposition:
    description: >-
      What a source does with a hypothesis it has raised. It records the
      source's own disposition, never Malleus's acceptance of it. Unset is the
      honest value when the source raises a hypothesis and never returns to
      it; a disposition these three do not cover is a gap to declare, which is
      how the list grows.
    permissible_values:
      PREFERRED:
        description: The source adopts the hypothesis as its own reading.
      NOT_SUPPORTED:
        description: The source raises the hypothesis and then declines it.
      UNDECIDED:
        description: >-
          The source weighs the hypothesis and leaves it open, stating that
          the evidence does not settle it.

  ResearchRelationType:
    description: Generic relation predicates supplied by the research pack.
    permissible_values:
      CLAIM_CONCERNS:
      OBSERVED_WITH:
      PART_OF_CAMPAIGN:
      SAMPLED_FROM:
      SUPPORTS:
      CHALLENGES:
      REPORTED_BY:
      CONTRIBUTED_TO:

classes:
  SourceAsserted:
    mixin: true
    description: >-
      Source-level modality, optional confidence, the entity the assertion is
      about, and the route and digest that reach the retained assertion behind
      a record. Worn by every claim-bearing record, so the route and the
      subject travel with the claim rather than with a copy of its text.
    slots:
      - assertion_modality
      - assertion_confidence
      - subject
      - assertion_locator
      - statement_sha256

  Evaluative:
    mixin: true
    description: >-
      Slots whose value is the source's evaluation of something the source has
      already stated, rather than a further statement of its own. This mixin's
      slot list is the pack's declaration of which slots are evaluative: a
      reader takes it from the compiled contract, and the document-assertion
      adapter refuses an evaluative value that no assertion outside
      HYPOTHESISED formalizes.
    slots:
      - hypothesis_disposition

  Contribution:
    mixin: true
    description: >-
      A record carrying the role in which a source credits a contributor.
      Worn by a relation so the role travels with the credited contribution
      rather than with the person, who may be credited differently elsewhere.
    slots:
      - contribution_role

  Claim:
    is_a: Entity
    mixins:
      - SourceAsserted
      - Evaluative
    description: >-
      An attributed statement represented as a graph entity. statement is
      optional and stays empty unless the record's Source declares a licence
      that permits reproducing the sentence; assertion_locator and
      statement_sha256 carry the assertion either way.
    slots:
      - statement
      - claim_kind

  Observation:
    is_a: Entity
    mixins:
      - Quantified
      - TemporalExtent
      - SourceAsserted
    description: A source-attributed observation with optional quantity and time.

  Method:
    is_a: Entity
    description: A method named by a source or investigation.

  Instrument:
    is_a: Entity
    description: An instrument used to produce an observation.

  Campaign:
    is_a: Entity
    mixins:
      - TemporalExtent
      - Counted
    description: A bounded research activity such as an observing campaign or study.

  Sample:
    is_a: Entity
    description: A sample observed or analysed by an investigation.

  Source:
    is_a: Entity
    description: A work or document that reports domain assertions.
    slots:
      - licence

  Evidence:
    is_a: Entity
    description: A retained reference from a graph statement back to source material.
    slots:
      - locator
      - source_digest

  ResearchRelation:
    is_a: Relation
    description: A typed research relation between graph entities.
    slot_usage:
      relation_type:
        range: ResearchRelationType

  ContributionRelation:
    is_a: ResearchRelation
    mixins:
      - Contribution
    description: >-
      A credited contribution from a contributor to a work, campaign, or
      dataset, carrying CONTRIBUTED_TO as its relation_type. contribution_role
      is optional, so a source that credits a person without stating the part
      they played is recorded without inventing one.

slots:
  assertion_modality:
    range: AssertionModality
    description: What the source says and how it says it, not whether Malleus accepts it.
  assertion_confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    description: Optional confidence stated by the source or adopter.
  claim_kind:
    range: string
    description: Project-defined refinement of a claim.
  hypothesis_disposition:
    range: HypothesisDisposition
    description: >-
      What the source does with a hypothesis it has raised. It is captured
      from the sentence that disposes of the hypothesis, not from the sentence
      that raises it. Unset for a claim the source never disposes of.
  contribution_role:
    range: ContributorRole
    description: >-
      Optional CRediT role in which the source credits this contribution. A
      contributor credited under several roles carries one relation per role.
      Unset is the honest value when the source names a contributor without
      stating the part they played.
  subject:
    range: Entity
    description: >-
      The entity this record's assertion is about, named as a record id that
      resolves in the same change set or the base state. Single and optional:
      a record whose subject the reading does not name leaves it unset, and
      the capture census counts it. The subject is never folded into
      quantity_kind text or into the record's own name, and it is never the
      record itself. The range is Entity, the same declaration a relation's
      endpoints carry, so what an assertion is about stays a reference to a
      thing rather than a sentence about one.
  assertion_locator:
    range: string
    description: >-
      Opaque route back to the retained assertion this record formalizes: an
      assertion id, a block id, a byte range, a time span in a recording. The
      pack does not interpret it and never assumes the source is a document.
  statement_sha256:
    range: string
    description: >-
      Digest of the exact retained assertion text, sha256: followed by 64
      lowercase hexadecimal characters. It compares two records against one
      assertion without the graph carrying the sentence.
  licence:
    range: string
    description: >-
      Licence the source declares for its own text, as the source declares it.
      Reproducing a source sentence in statement requires one that permits it;
      absent a licence, the sentence stays out of graph state.
  source_digest:
    range: string
    description: Digest of exact retained source bytes.
