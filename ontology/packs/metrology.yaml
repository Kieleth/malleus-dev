id: https://malleus.dev/schema/packs/metrology
name: malleus_metrology
version: 0.3.0
title: Malleus Metrology Knowledge Pack
description: >-
  Optional reusable vocabulary for quantities, bounds, units, uncertainty,
  determination basis, ratios, and counts. Importing this pack is an adopter
  choice and does not change the Malleus protocol.

default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  malleus: https://malleus.dev/schema/
  metrology: https://malleus.dev/schema/packs/metrology/

imports:
  - linkml:types
  - malleus

annotations:
  grounding:
    tag: grounding
    value:
      area: Physical measurement
      taxonomy: DDC 530.8
      vocabularies:
        - vocabulary: JCGM 200:2012 International Vocabulary of Metrology, 3rd edition
          vocabulary_url: https://www.bipm.org/documents/20126/2071204/JCGM_200_2012.pdf
          borrowed_terms:
            - quantity value
            - measurement unit
            - measurement uncertainty
            - kind of quantity
        - vocabulary: QUDT Quantity Kinds
          vocabulary_url: http://qudt.org/vocab/quantitykind/
          borrowed_terms:
            - Length
            - Time
            - Temperature
            - Pressure
            - Mass
            - Volume
            - Area
            - Velocity
            - Density
            - Frequency
            - Energy
            - Force
            - MassFraction
            - Count
            - Angle
      invented_terms:
        - ValueQualification
      invention_search: >-
        No vocabulary among QUDT, UCUM, ISO 80000 and the VIM cited above
        names how a source qualifies the number it states. The QUDT schema
        carries standardUncertainty and relativeStandardUncertainty, which
        quantify a measurement's dispersion rather than a source's hedge, and
        minInclusive and maxInclusive, which constrain a datatype rather than
        describe a stated bound. VIM 4.6 defines nominal quantity value as a
        rounded or approximate value characterizing a measuring instrument,
        not a reported measurement, and VIM defines no term for an
        open-ended statement. UCUM codes units and discards annotations by
        definition. ISO 80000-2 supplies the relation sign read as is
        approximately equal to, a mathematical symbol rather than a
        qualification of a reported value. The enum name and its five values
        are therefore local.

enums:
  ValueQualification:
    description: >-
      How the source qualifies the number it states. It records the form of
      the statement and never the number: value_lower, value_upper and unit
      stay exactly as the source gives them. Leaving it unset is the honest
      value when the source's form is unclear. The list is deliberately short
      and grows by adding values, never by redefining one.
    permissible_values:
      EXACT:
        description: >-
          The source states the number without qualification. value_lower and
          value_upper carry it as a closed pair.
      APPROXIMATE:
        description: >-
          The source marks the number as approximate. The bounds carry the
          stated number unchanged; the approximation is recorded here and is
          never converted into an invented interval.
      OPEN_LOWER_BOUND:
        description: >-
          The source states only a lower bound. value_lower carries the stated
          number and value_upper stays absent, because the source states no
          upper bound and inventing one would report something it does not
          say.
      OPEN_UPPER_BOUND:
        description: >-
          The source states only an upper bound. value_upper carries the
          stated number and value_lower stays absent, for the same reason.
      ORDER_OF_MAGNITUDE:
        description: >-
          The source states the number only to an order of magnitude.

  QuantityKindClass:
    description: >-
      Controlled classification of a reported quantity. Every value except
      OTHER is a name minted in the QUDT quantity-kind vocabulary, spelled as
      QUDT spells it. OTHER is local and records that no listed kind fits. The
      list is deliberately short and grows by adding values, never by
      redefining one.
    permissible_values:
      Length:
      Time:
      Temperature:
      Pressure:
      Mass:
      Volume:
      Area:
      Velocity:
      Density:
      Frequency:
      Energy:
      Force:
      MassFraction:
      Count:
      Angle:
      OTHER:

  Determination:
    description: How a quantity value was obtained.
    permissible_values:
      MEASURED:
      DERIVED:
      ESTIMATED:
      MODELLED:

classes:
  Quantified:
    mixin: true
    description: A record carrying a bounded quantity and its measurement context.
    slots:
      - quantity_kind
      - quantity_kind_class
      - value_lower
      - value_upper
      - value_qualification
      - unit
      - uncertainty
      - determination

  Counted:
    mixin: true
    description: A record carrying an integer count and the scope counted.
    slots:
      - count
      - count_scope

  QuantityValue:
    is_a: Entity
    mixins:
      - Quantified
    description: A quantity represented as a graph entity when a project needs it.

  Ratio:
    is_a: Entity
    description: A ratio whose numerator and denominator kinds remain explicit.
    slots:
      - numerator_kind
      - denominator_kind
      - ratio_value
      - uncertainty

slots:
  quantity_kind:
    range: string
    description: >-
      Kind of quantity being reported, in the source's own wording. Open on
      purpose: it is what the source said, and it is never rewritten to fit
      quantity_kind_class.
  quantity_kind_class:
    range: QuantityKindClass
    description: >-
      Optional classification of the same quantity against the QUDT
      quantity-kind names, so that two records reporting one kind under
      different wording compare. OTHER when no listed kind fits. Leaving it
      unset is the honest result when the source's kind is unclear.
  value_lower:
    range: float
    description: Lower bound, equal to value_upper for an exact value.
  value_upper:
    range: float
    description: Upper bound, equal to value_lower for an exact value.
  value_qualification:
    range: ValueQualification
    description: >-
      Optional record of how the source states the number: exact, approximate,
      open at one end, or only to an order of magnitude. It qualifies the
      statement, never the value, so the bounds and the unit stay as the source
      gives them. An open bound leaves the absent end unset, which the shape
      permits. Unset is the honest value when the source's form is unclear.
  unit:
    range: string
    description: Measurement unit, preferably a UCUM code where one exists.
  uncertainty:
    range: float
    description: Reported measurement uncertainty.
  determination:
    range: Determination
    description: How the quantity was determined.
  count:
    range: integer
    description: Integer number of things counted.
  count_scope:
    range: string
    description: What the count includes.
  numerator_kind:
    range: string
    description: Quantity kind in the ratio numerator.
  denominator_kind:
    range: string
    description: Quantity kind in the ratio denominator.
  ratio_value:
    range: float
    description: Numeric value of the ratio.
