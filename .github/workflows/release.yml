name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate immutable release ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require exact version tag on main history
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Releases require an immutable tag ref."
            exit 1
          fi

          FILE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          EXPECTED_TAG="v${FILE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must exactly equal '$EXPECTED_TAG'."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "::error::Tag commit '$TAG_COMMIT' is not on origin/main."
            exit 1
          fi

  test:
    name: Python tests (${{ matrix.python-version }})
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog
      - name: Install malleus-dev with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Run GraphRecipe conformance slice
        run: |
          python -m ruff check src/malleus research/ontology_driven_kg_realization/experiments/graph_recipe
          PYTHONPATH=src python -m pytest -q research/ontology_driven_kg_realization/experiments/graph_recipe/test_cases.py

  build:
    name: Build wheel + sdist
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Build wheel + sdist
        run: python -m build

      - name: twine check
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        # twine check validates metadata, never entry-point targets. Install
        # the wheel and invoke every declared console script so a manifest
        # referencing uncommitted files fails here, not on a user's machine.
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          SCHEMA=$(/tmp/wheel-smoke/bin/python -c "from malleus.ontology import bundled_ontology_path; print(bundled_ontology_path('malleus.yaml'))")
          /tmp/wheel-smoke/bin/malleus-inquisitor "$SCHEMA"
          /tmp/wheel-smoke/bin/malleus-recon --help

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC token for Trusted Publishing. No API token in GitHub Secrets.
      # PyPI project must be configured with this repo as a Trusted Publisher.
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
