name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SWI-Prolog (for optional Prolog extra)
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - name: Install malleus-dev with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # Bare pytest so CI and a local run collect the identical testpaths set.
        run: pytest -v

      - name: Validate contract compiler overseer ledger
        run: |
          python -m ruff check scripts/contract_compiler_ledger.py tests/test_contract_compiler_ledger.py
          python -m pytest -q tests/test_contract_compiler_ledger.py
          python scripts/contract_compiler_ledger.py check
          python scripts/contract_compiler_ledger.py verify-evidence design/contract_compiler/overseer/evidence/CC-D01.json

      - name: Validate contract compiler integration gate
        run: |
          python -m ruff check scripts/contract_compiler_integration.py tests/test_contract_compiler_integration.py
          python -m pytest -q tests/test_contract_compiler_integration.py
          python scripts/contract_compiler_integration.py check

      - name: Run GraphRecipe conformance slice
        run: |
          python -m ruff check src/malleus research/ontology_driven_kg_realization/experiments/graph_recipe
          PYTHONPATH=src python -m pytest -q research/ontology_driven_kg_realization/experiments/graph_recipe/test_cases.py

      - name: Build wheel and smoke-test it in a clean environment
        # Editable installs resolve from the working tree, so a manifest
        # referencing missing files is invisible to pytest. Build the real
        # artifact and invoke its console script on every push and PR.
        run: |
          python -m build --wheel
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          SCHEMA=$(/tmp/wheel-smoke/bin/python -c "from malleus.ontology import bundled_ontology_path; print(bundled_ontology_path('malleus.yaml'))")
          /tmp/wheel-smoke/bin/malleus-inquisitor "$SCHEMA"
          /tmp/wheel-smoke/bin/malleus-recon --help
