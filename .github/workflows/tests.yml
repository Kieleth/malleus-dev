name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SWI-Prolog (for optional Prolog extra)
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - name: Install malleus-dev with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the shared local test gate
        run: python scripts/ci.py test --require-clean

      - name: Build strict documentation
        if: matrix.python-version == '3.12'
        run: python scripts/ci.py docs --require-clean

      - name: Build wheel and smoke-test it in a clean environment
        run: python scripts/ci.py package --require-clean
